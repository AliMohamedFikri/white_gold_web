    <style>
        body {
            box-sizing: border-box;
        }

        * {
            font-family: 'Cairo', sans-serif;
        }

        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #7c3aed 50%, #764ba2 100%);
        }

        .card-shadow {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .hover-scale {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .hover-scale:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #7c3aed 50%, #764ba2 100%);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-primary::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 60%);
            pointer-events: none;
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4), 0 4px 12px rgba(124, 58, 237, 0.25);
        }

        .size-badge {
            transition: all 0.2s ease;
        }

        .size-badge:hover {
            transform: scale(1.1);
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading-spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .print-only {
            display: none;
        }

        .sync-badge {
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .sync-success {
            background: linear-gradient(135deg, #dcfce7, #d1fae5);
            color: #166534;
            border: 1px solid #bbf7d0;
            box-shadow: 0 2px 8px rgba(22, 101, 52, 0.08);
        }

        .analysis-card {
            border-right: 4px solid transparent;
            border-image: linear-gradient(180deg, #667eea, #7c3aed, #764ba2) 1;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .analysis-card::after {
            content: '';
            position: absolute;
            top: 0; right: 0; width: 80px; height: 80px;
            background: radial-gradient(circle at top right, rgba(102, 126, 234, 0.08), transparent 70%);
            pointer-events: none;
        }

        .analysis-card:hover {
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.08);
        }

        .loading-overlay {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
        }


        /* Page-level print rules (bill-specific rules live in template_v7.js) */
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white; }
            html, body, #app, .h-full, .min-h-screen {
                height: auto !important;
                overflow: visible !important;
                position: static !important;
            }
            .flex-1, .overflow-auto, .overflow-hidden {
                overflow: visible !important;
                height: auto !important;
                display: block !important;
            }
            .fixed.inset-y-0 { display: none !important; }
            /* Fallback-template print helpers */
            .print-header-grid {
                display: grid !important;
                grid-template-columns: 1fr 1fr !important;
                gap: 0 !important; align-items: start !important;
            }
            .print-company { text-align: right !important; margin: 0 !important; padding: 0 !important; }
            .print-invoice { text-align: left !important; margin: 0 !important; padding: 0 !important; }
            .print-company div, .print-invoice div { margin: 0 !important; padding: 0 !important; }
        }

        .pdf-capture-mode .print-header-grid {
            display: grid !important;
            grid-template-columns: 1fr 1fr !important;
            gap: 0 !important;
            align-items: start !important;
        }

        .pdf-capture-mode .print-company {
            text-align: right !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        .pdf-capture-mode .print-invoice {
            text-align: left !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        .pdf-capture-mode .print-company div,
        .pdf-capture-mode .print-invoice div {
            margin: 0 !important;
            padding: 0 !important;
        }

        .pdf-capture-mode {
            height: auto !important;
            overflow: visible !important;
            display: block !important;
        }

        .landing-shell {
            position: relative;
            overflow: hidden;
        }

        .landing-atmosphere {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .landing-orb {
            position: absolute;
            border-radius: 9999px;
            filter: blur(4px);
            opacity: 0.25;
            animation: driftFloat 14s ease-in-out infinite;
        }

        .landing-orb.one {
            width: 480px;
            height: 480px;
            top: -160px;
            right: -120px;
            background: radial-gradient(circle at 30% 30%, #ffffff 0%, rgba(255, 255, 255, 0.1) 55%, rgba(255, 255, 255, 0) 70%);
        }

        .landing-orb.two {
            width: 360px;
            height: 360px;
            bottom: 120px;
            left: -80px;
            background: radial-gradient(circle at 50% 50%, #fde68a 0%, rgba(253, 230, 138, 0.12) 60%, rgba(253, 230, 138, 0) 72%);
            animation-delay: -4s;
        }

        .landing-grid-overlay {
            position: absolute;
            inset: 0;
            background-image: linear-gradient(rgba(255, 255, 255, 0.12) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.12) 1px, transparent 1px);
            background-size: 36px 36px;
            opacity: 0.08;
        }

        .landing-nav {
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.18);
        }

        .landing-nav-link {
            position: relative;
            transition: opacity 0.2s ease;
        }

        .landing-nav-link::after {
            content: '';
            position: absolute;
            inset-inline-start: 0;
            bottom: -6px;
            width: 0;
            height: 2px;
            background: #ffffff;
            transition: width 0.25s ease;
        }

        .landing-nav-link:hover::after {
            width: 100%;
        }

        .landing-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.18);
            color: #ffffff;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.15), inset 0 1px 0 rgba(255,255,255,0.15);
            backdrop-filter: blur(6px);
        }

        .landing-hero-title {
            text-wrap: balance;
            letter-spacing: -0.02em;
        }

        .landing-hero-metrics {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0.75rem;
            margin: 0 auto;
        }

        .landing-metric-card {
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.24);
            backdrop-filter: blur(6px);
            padding: 0.9rem;
            color: #ffffff;
        }

        .landing-product-card {
            border: 1px solid rgba(15, 23, 42, 0.08);
            background: #ffffff;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
        }

        .landing-category-icon {
            width: 100%;
            border-radius: 12px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            max-height: 220px;
            border: 1px solid rgba(15, 23, 42, 0.06);
        }

        .landing-category-icon img,
        .landing-category-icon .category-icon-img {
            width: auto !important;
            height: auto !important;
            max-width: 100%;
            max-height: 180px;
            object-fit: contain;
            display: block;
            margin: 0 !important;
            transition: transform 0.3s ease;
        }

        .landing-category-icon:hover img {
            transform: scale(1.05);
        }

        .bill-table td .category-icon-img,
        .analysis-card .category-icon-img,
        .card-shadow .category-icon-img {
            width: 40px !important;
            height: 40px !important;
            object-fit: contain;
            vertical-align: middle;
            display: inline-block;
            border-radius: 8px;
        }

        .bill-table td .flex,
        .analysis-card .flex {
            align-items: center;
            gap: 0.5rem;
        }

        .landing-about-panel {
            border-radius: 20px;
            border: 1px solid rgba(15, 23, 42, 0.1);
            background: linear-gradient(140deg, rgba(255, 255, 255, 0.95) 0%, rgba(241, 245, 249, 0.8) 100%);
            padding: clamp(1.25rem, 2.4vw, 2rem);
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.12);
        }

        .landing-contact-card {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0.08) 100%);
            border: 1px solid rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08), inset 0 1px 0 rgba(255,255,255,0.15);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .landing-contact-card:hover {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.3) 0%, rgba(255, 255, 255, 0.12) 100%);
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12), inset 0 1px 0 rgba(255,255,255,0.2);
        }

        @keyframes driftFloat {
            0% {
                transform: translate3d(0, 0, 0);
            }

            50% {
                transform: translate3d(0, -16px, 0);
            }

            100% {
                transform: translate3d(0, 0, 0);
            }
        }

        @media (max-width: 768px) {
            .landing-hero-metrics {
                grid-template-columns: 1fr;
            }
        }

        @view-transition {
            navigation: auto;
        }

        .glass-sidebar {
            background: linear-gradient(180deg, rgba(102, 126, 234, 0.95) 0%, rgba(124, 58, 237, 0.92) 40%, rgba(118, 75, 162, 0.95) 100%);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-left: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: -10px 0 40px rgba(31, 38, 135, 0.18);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.07), 0 1px 3px rgba(102, 126, 234, 0.04);
            border-radius: 1.5rem;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .glass-card::after {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 120px; height: 120px;
            background: radial-gradient(circle at top right, rgba(102, 126, 234, 0.05), transparent 70%);
            pointer-events: none;
            transition: opacity 0.3s ease;
            opacity: 0;
        }

        .glass-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 48px rgba(31, 38, 135, 0.12), 0 4px 16px rgba(102, 126, 234, 0.08);
            border-color: rgba(102, 126, 234, 0.2);
            background: rgba(255, 255, 255, 0.95);
        }

        .glass-card:hover::after {
            opacity: 1;
        }

        .glass-tinted {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.9), rgba(124, 58, 237, 0.88), rgba(118, 75, 162, 0.9));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(102, 126, 234, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            border-radius: 1.5rem;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .glass-tinted::after {
            content: '';
            position: absolute;
            top: -50%; right: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.08), transparent 60%);
            pointer-events: none;
        }

        .glass-tinted:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 48px rgba(102, 126, 234, 0.3), 0 4px 16px rgba(124, 58, 237, 0.15);
        }

        .text-hero {
            font-family: 'Cairo', sans-serif;
            line-height: 1.15;
            letter-spacing: -0.02em;
        }

        .text-subdata {
            font-family: 'Cairo', sans-serif;
            line-height: 1.65;
            letter-spacing: 0;
            font-feature-settings: "tnum";
        }

        @keyframes staggerFadeIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
                filter: blur(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        .stagger-item {
            opacity: 0;
            animation: staggerFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: calc(var(--stagger-index, 0) * 100ms);
        }

        .size-badge-neo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            color: #475569;
            box-shadow:
                4px 4px 10px rgba(163, 177, 198, 0.5),
                -4px -4px 10px rgba(255, 255, 255, 0.9);
            border-radius: 9999px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.6);
            cursor: pointer;
            user-select: none;
            position: relative;
            overflow: hidden;
        }

        .size-badge-neo::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 9999px;
            opacity: 0;
            transition: opacity 0.3s ease;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
        }

        .size-badge-neo:hover {
            transform: scale(1.08);
            color: #667eea;
        }

        .size-badge-neo:hover::after {
            opacity: 1;
        }

        .size-badge-neo:active,
        .size-badge-neo.pressed {
            box-shadow:
                inset 3px 3px 6px rgba(163, 177, 198, 0.5),
                inset -3px -3px 6px rgba(255, 255, 255, 0.9);
            transform: scale(0.94);
            color: #764ba2;
            font-weight: 800;
        }

        @keyframes glowPulse {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(102, 126, 234, 0.35), 0 8px 24px rgba(15, 23, 42, 0.06);
            }

            50% {
                box-shadow: 0 0 40px 0 rgba(102, 126, 234, 0.25), 0 8px 24px rgba(15, 23, 42, 0.06);
            }
        }

        .glow-pulse {
            animation: glowPulse 3s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }

        .glow-pulse::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.06) 0%, transparent 60%);
            animation: rotateGradient 8s linear infinite;
            pointer-events: none;
        }

        @keyframes rotateGradient {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .mesh-bg-container {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
            background: #f8fafc;
        }

        .mesh-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.55;
            will-change: transform;
            animation: meshMove 20s infinite alternate ease-in-out;
        }

        .mesh-blob-1 {
            width: 65vw;
            height: 65vw;
            max-width: 900px;
            max-height: 900px;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.38) 0%, rgba(124, 58, 237, 0.15) 40%, transparent 70%);
            top: -15%;
            right: -10%;
            animation-duration: 22s;
        }

        .mesh-blob-2 {
            width: 55vw;
            height: 55vw;
            max-width: 800px;
            max-height: 800px;
            background: radial-gradient(circle, rgba(118, 75, 162, 0.32) 0%, rgba(124, 58, 237, 0.12) 40%, transparent 70%);
            bottom: -15%;
            left: -10%;
            animation-duration: 28s;
            animation-delay: -6s;
        }

        .mesh-blob-3 {
            width: 45vw;
            height: 45vw;
            max-width: 600px;
            max-height: 600px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.22) 0%, rgba(52, 211, 153, 0.08) 40%, transparent 70%);
            top: 40%;
            left: 25%;
            animation-duration: 24s;
            animation-delay: -12s;
        }

        @keyframes meshMove {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
            }

            33% {
                transform: translate(40px, -60px) scale(1.1) rotate(5deg);
            }

            66% {
                transform: translate(-30px, 30px) scale(0.9) rotate(-5deg);
            }

            100% {
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
        }

        .about-section {
            position: relative;
            overflow: hidden;
        }

        .about-section::before {
            content: '';
            position: absolute;
            top: -10%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.12) 0%, transparent 70%);
            pointer-events: none;
            animation: meshMove 25s infinite alternate ease-in-out;
        }

        .about-section::after {
            content: '';
            position: absolute;
            bottom: -10%;
            left: -10%;
            width: 400px;
            height: 400px;

<body class="h-full w-full">
    <div id="loading-screen" class="fixed inset-0 z-[100] flex items-center justify-center loading-overlay hidden">
        <div class="text-center">
            <div
                class="w-12 h-12 border-4 rounded-full animate-spin mx-auto mb-4"
                style="border-color: rgba(102, 126, 234, 0.2); border-top-color: #667eea;">
            </div>
            <p class="text-slate-600 font-bold">جاري التحقق من الجلسة...</p>
        </div>
    </div>

    <div id="app" class="h-full w-full overflow-auto"></div>
    <script>
        // ============================================================
        // IMPROVED #1: Lazy-load heavy libraries on first use
        // Previously: html2pdf (~800KB) and SheetJS (~550KB) were loaded
        // synchronously on every page visit, blocking the parser.
        // Now they are loaded only when first needed.
        // ============================================================
        const _lazyScripts = {};

        function loadScriptOnce(src, integrity) {
            if (_lazyScripts[src]) return _lazyScripts[src];
            _lazyScripts[src] = new Promise((resolve, reject) => {
                // Already present in DOM (e.g. loaded synchronously elsewhere)
                if (document.querySelector(`script[src="${src}"]`) && window[_scriptGlobalName(src)]) {
                    resolve();
                    return;
                }
                const script = document.createElement('script');
                script.src = src;
                script.async = true;
                // SECURITY: Add Subresource Integrity for CDN scripts
                if (integrity) {
                    script.integrity = integrity;
                    script.crossOrigin = 'anonymous';
                }
                script.onload = resolve;
                script.onerror = () => reject(new Error(`Failed to load: ${src}`));
                document.head.appendChild(script);
            });
            return _lazyScripts[src];
        }

        function _scriptGlobalName(src) {
            if (src.includes('html2pdf')) return 'html2pdf';
            if (src.includes('html2canvas')) return 'html2canvas';
            if (src.includes('xlsx')) return 'XLSX';
            return '';
        }

        async function ensureHtml2Pdf() {
            if (typeof html2pdf === 'function') return;
            await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js', 'sha384-Yv5O+t3uE3hunW8uyrbpPW3iw6/5/Y7HitWJBLgqfMoA36NogMmy+8wWZMpn3HWc');
        }

        async function ensureHtml2Canvas() {
            if (typeof html2canvas === 'function') return;
            await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
            if (typeof html2canvas !== 'function') throw new Error('html2canvas not available');
        }

        async function ensureSheetJS() {
            if (typeof XLSX !== 'undefined') return;
            await loadScriptOnce('https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js', 'sha384-QCIdq2UMVEoSRhR3ZWZwdz2/pivLowr+eokFMdYyukq7qI26VYRxFa4Nl6FKetmL');
        }

        // ============================================================
        // IMPROVED #2: Debounced render — batch all state changes
        // into a single DOM update per animation frame.
        // Previously: every setLoading() call triggered a full
        // innerHTML rebuild, causing visible flicker.
        // ============================================================
        let _renderPending = false;

        // IMPROVED #3: Guard render() until templates are ready.
        // Previously: render() could be called before bill templates
        // finished loading, showing broken UI for ~200ms.
        let _appReady = false;

        function render() {
            if (_renderPending) return; // already queued
            _renderPending = true;
            requestAnimationFrame(() => {
                _renderPending = false;
                if (!_appReady) return; // templates not loaded yet — skip
                _doRender();
            });
        }

        // The actual render logic, extracted so it can be called
        // directly once during init (after _appReady = true).
        function _doRender() {
            const app = document.getElementById('app');
            if (!app) return;

            if (appState.currentView === 'landing') {
                app.innerHTML = renderLanding();
                return;
            }

            if (!appState.isAuthenticated) {
                app.innerHTML = renderLogin();
            } else {
                app.innerHTML = renderDashboardLayout();
                attachEventListeners();
            }

            if (appState.currentView === 'viewBill') {
                setTimeout(() => {
                    if (appState.currentView === 'viewBill' && !appState.currentBillPdfBlob) {
                        requestAnimationFrame(() => preGenerateBillPdf());
                    }
                });
            }
        }

        function setupImageFallback(imgElement, productName) {
            if (!imgElement) return;
            imgElement.addEventListener('error', function () {
                imgElement.style.display = 'none';
            }, { once: true });
        }

        // Gracefully load optional SDK scripts — these may not exist in all
        // deployment environments.  resolve(false) = missing, resolve(true) = loaded.
        function loadOptionalSdkScript(src) {
            return new Promise((resolve) => {
                const script = document.createElement('script');
                script.src = src;
                script.async = true;
                script.onload = () => resolve(true);
                script.onerror = () => resolve(false);   // silently skip missing files
                document.head.appendChild(script);
            });
        }

        async function initOptionalSdks() {
            const isWebContext = window.location.protocol === 'http:' || window.location.protocol === 'https:';
            if (!isWebContext) return;
            const results = await Promise.allSettled([
                loadOptionalSdkScript('/_sdk/data_sdk.js'),
                loadOptionalSdkScript('/_sdk/element_sdk.js')
            ]);
            // Optional: log which SDKs were found
            const names = ['dataSdk', 'elementSdk'];
            results.forEach((r, i) => {
                if (r.status === 'fulfilled' && r.value) console.log(WGIcon('check') + ' ' + names[i] + ' loaded');
                else console.info(WGIcon('info') + ' ' + names[i] + ' not found — using built-in fallback');
            });
        }

        // Bill template versioning
        const BILL_TEMPLATE_VERSION = 'v7';
        const BILL_FALLBACK_TEMPLATE_VERSION = 'fallback';
        const BILL_TEMPLATE_FILES = {
            fallback: 'bill_templates/template_fallback.js',
            v7: 'bill_templates/template_v7.js'
        };
        let activeBillTemplate = null;

        function upsertBillTemplateStyles(cssText) {
            const styleId = 'bill-template-styles';
            let styleTag = document.getElementById(styleId);
            if (!styleTag) {
                styleTag = document.createElement('style');
                styleTag.id = styleId;
                document.head.appendChild(styleTag);
            }
            styleTag.textContent = cssText || '';
        }

        async function loadBillTemplate(version) {
            const resolvedVersion = BILL_TEMPLATE_FILES[version] ? version : BILL_FALLBACK_TEMPLATE_VERSION;
            const versionFile = BILL_TEMPLATE_FILES[resolvedVersion];
            if (!versionFile) {
                console.error('Unknown bill template version:', version);
                return;
            }

            if (!window.billTemplateRegistry) window.billTemplateRegistry = {};

            if (!window.billTemplateRegistry[resolvedVersion]) {
                await new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = `${versionFile}?v=${encodeURIComponent(resolvedVersion)}`;
                    script.async = true;
                    script.onload = resolve;
                    script.onerror = reject;
                    document.head.appendChild(script);
                });
            }

            activeBillTemplate = window.billTemplateRegistry[resolvedVersion] || null;

            if (resolvedVersion !== version) {
                console.error('Unknown bill template version, using fallback:', version);
            }

            if (activeBillTemplate?.styles) upsertBillTemplateStyles(activeBillTemplate.styles);
            if (activeBillTemplate?.preloadAssets) await activeBillTemplate.preloadAssets(appState);
        }

        // Secure storage wrappers
        function storageSet(key, value, userScope = null) {
            if (window.SecureStorage?.setItem) return window.SecureStorage.setItem(key, value, userScope);
            localStorage.setItem(key, value);
            return true;
        }

        function storageGet(key, userScope = null) {
            if (window.SecureStorage?.getItem) return window.SecureStorage.getItem(key, userScope);
            return localStorage.getItem(key);
        }

        function storageRemove(key, userScope = null) {
            if (window.SecureStorage?.removeItem) return window.SecureStorage.removeItem(key, userScope);
            localStorage.removeItem(key);
            return true;
        }

        function sanitizeTextInput(value) {
            if (window.SecurityUtils?.sanitizeHTML) return window.SecurityUtils.sanitizeHTML(value || '');
            return escapeHtml(value || '');
        }

        function sanitizeClientNameInput(value) {
            if (window.SecurityUtils?.sanitizeClientName) return window.SecurityUtils.sanitizeClientName(value || '');
            return String(value || '').trim();
        }

        function sanitizeNumericInput(value, defaultValue = 0) {
            if (window.SecurityUtils?.sanitizeNumber) return window.SecurityUtils.sanitizeNumber(value, defaultValue);
            const num = parseFloat(value);
            return isNaN(num) ? defaultValue : num;
        }

        function isRateLimitExceeded(action, message) {
            if (window.RateLimiter?.isAllowed && !window.RateLimiter.isAllowed(action)) {
                showToast(message || 'تم تجاوز الحد الأقصى للطلبات. يرجى المحاولة لاحقاً', 'error');
                window.AuditLog?.log?.('rate_limited_action_blocked', { action });
                return true;
            }
            return false;
        }

        function initSecurityLayer() {
            window.AuthManager?.init?.();
            window.AuditLog?.log?.('app_security_layer_initialized');
        }

        // Auth / Session Manager
        const authManager = {
            // FIX: access token is NEVER stored — only the Drive file ID is persisted.
            // On the next page load tryRestoreSession() silently requests a fresh token
            // from Google without showing a popup (if the user is still signed in).
            saveSession(driveId) {
                storageSet('wg_drive_id', driveId);
                storageSet('wg_last_login', String(Date.now()));
                window.AuditLog?.log?.('session_saved', { driveId: !!driveId });
            },
            clearSession() {
                storageRemove('wg_drive_id');
                storageRemove('wg_last_login');
                window.AuditLog?.log?.('session_cleared');
            },
            getSession() {
                const driveId = storageGet('wg_drive_id');
                return driveId ? { driveId } : null;
            }
        };

        /**
         * Verify an access token is still valid and issued for our Drive scope.
         * Uses Google's public tokeninfo endpoint (no secret required).
         * Returns true if the token has at least 60 seconds left.
         */
        async function validateToken(token) {
            try {
                const res = await fetch(
                    'https://oauth2.googleapis.com/tokeninfo?access_token=' +
                    encodeURIComponent(token)
                );
                const info = await res.json();
                if (info.error || !info.expires_in) return false;
                if (parseInt(info.expires_in) < 60) return false; // < 1 minute left
                // Confirm the scope covers drive.file
                if (!info.scope || !info.scope.includes('drive')) return false;
                return true;
            } catch (e) {
                console.warn('[validateToken] failed:', e);
                return false;
            }
        }

        // Sync Manager
        const syncManager = {
            enrich(item) {
                return { ...item, lastSyncedAt: new Date().toISOString(), syncStatus: 'synced' };
            },
            getBadge(item) {

        async function findOrCreateDriveFile() {
            if (isRateLimitExceeded('google_drive_search', 'تم تجاوز الحد الأقصى للطلبات. يرجى المحاولة لاحقاً')) {
                throw new Error('Rate limit exceeded: google_drive_search');
            }
            const searchRes = await fetch(
                `https://www.googleapis.com/drive/v3/files?q=name='${DRIVE_FILE_NAME}' and trashed=false&spaces=drive`,
                { headers: { Authorization: `Bearer ${googleAccessToken}` } }
            );
            const searchData = await searchRes.json();
            if (searchData.files && searchData.files.length > 0) return searchData.files[0].id;
            const metadata = { name: DRIVE_FILE_NAME, mimeType: 'application/json' };
            const form = new FormData();
            form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
            form.append('file', new Blob(['[]'], { type: 'application/json' }));
            if (isRateLimitExceeded('google_drive_create_file', 'تم تجاوز الحد الأقصى لعمليات الإنشاء. يرجى المحاولة لاحقاً')) {
                throw new Error('Rate limit exceeded: google_drive_create_file');
            }
            const createRes = await fetch(
                'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',
                {
                    method: 'POST',
                    headers: { Authorization: `Bearer ${googleAccessToken}` },
                    body: form
                }
            );
            const file = await createRes.json();
            return file.id;
        }

        async function readDriveFile() {
            if (isRateLimitExceeded('google_drive_read', 'تم تجاوز الحد الأقصى لعمليات القراءة. يرجى المحاولة لاحقاً')) {
                throw new Error('Rate limit exceeded: google_drive_read');
            }
            const res = await fetch(
                `https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`,
                { headers: { Authorization: `Bearer ${googleAccessToken}` } }
            );
            if (!res.ok) {
                if (res.status === 401) {
                    // IMPROVED: non-destructive 401 handling
                    handleDriveAuthError();
                }
                throw new Error('Failed to read Drive file: ' + res.status);
            }
            const text = await res.text();
            return JSON.parse(text || '[]');
        }

        async function writeDriveFile(data) {
            if (isRateLimitExceeded('google_drive_write', 'تم تجاوز الحد الأقصى لعمليات الحفظ. يرجى المحاولة لاحقاً')) {
                throw new Error('Rate limit exceeded: google_drive_write');
            }
            const res = await fetch(
                `https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`,
                {
                    method: 'PATCH',
                    headers: {
                        Authorization: `Bearer ${googleAccessToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                }
            );
            if (!res.ok) {
                if (res.status === 401) {
                    // IMPROVED: non-destructive 401 handling
                    handleDriveAuthError();
                }
                throw new Error('Failed to write Drive file: ' + res.status);
            }
        }

        // Migration: convert old flat pricing model format to grouped-by-name format
        function migrateToGroupedFormat(data) {
            if (!Array.isArray(data)) return [];
            const hasOldFormat = data.some(d => d.type === 'pricingModel' && !Array.isArray(d.data));
            if (!hasOldFormat) return data;
            const modelGroups = {};
            const otherData = [];
            for (const item of data) {
                if (item.type === 'pricingModel' && !Array.isArray(item.data)) {
                    const name = item.pricingModelName;
                    if (!modelGroups[name]) modelGroups[name] = { type: 'pricingModel', pricingModelName: name, data: [] };
                    modelGroups[name].data.push({
                        pricingModelData: item.pricingModelData,
                        createdAt: item.createdAt,
                        updatedAt: item.updatedAt,
                        __backendId: item.__backendId
                    });
                } else {
                    otherData.push(item);
                }
            }
            return [...otherData, ...Object.values(modelGroups)];
        }

            // driveFileId is already set by the caller
            let data = await readDriveFile();
            if (!Array.isArray(data)) data = [];
            data = migrateToGroupedFormat(data);

            _attachDriveSdkMethods(data);
        }

            window.dataSdk = {
                init: async (handler) => {

                create: async (item) => {
                    const data = await readDriveFile();
                    const now = new Date().toISOString();
                    const newItem = { ...item, updatedAt: item.updatedAt || now, __backendId: Date.now().toString() };
                    if (item.type === 'bill') {
                        delete newItem.items;
                        data.push(newItem);
                    } else if (item.type === 'pricingModel') {
                        const versionData = {
                            pricingModelData: newItem.pricingModelData,
                            createdAt: newItem.createdAt || now,
                            updatedAt: now,
                            __backendId: newItem.__backendId
                        };
                        let group = data.find(d => d.type === 'pricingModel' && d.pricingModelName === newItem.pricingModelName);
                        if (group) {
                            group.data.push(versionData);
                        } else {
                            data.push({ type: 'pricingModel', pricingModelName: newItem.pricingModelName, data: [versionData] });
                        }
                    } else {
                        newItem.createdAt = item.createdAt || now;
                        data.push(newItem);
                    }
                    await writeDriveFile(data);
                    if (window._dataHandler) window._dataHandler.onDataChanged(data);
                    return { isOk: true, id: newItem.__backendId };
                },
                update: async (item) => {
                    const data = await readDriveFile();
                    const now = new Date().toISOString();
                    if (item.type === 'pricingModel') {
                        const group = data.find(d => d.type === 'pricingModel' && d.pricingModelName === item.pricingModelName);
                        if (group) {
                            const vIdx = group.data.findIndex(v => v.__backendId === item.__backendId);
                            if (vIdx >= 0) {
                                group.data[vIdx] = { ...group.data[vIdx], pricingModelData: item.pricingModelData, updatedAt: now };
                                await writeDriveFile(data);
                                if (window._dataHandler) window._dataHandler.onDataChanged(data);
                                return { isOk: true };
                            }
                        }
                        return { isOk: false };
                    }
                    let index = data.findIndex(d => d.__backendId === item.__backendId);
                    if (index < 0) index = data.findIndex(d => d.type === 'bill' && (d.billNumber === item.billNumber || d.bn === item.billNumber));
                    if (index >= 0) {
                        const originalItem = data[index] || {};
                        const updatedItem = { ...originalItem, ...item, updatedAt: now };
                        if ((updatedItem.type || item.type) === 'bill') {

        async function handleGoogleSignIn(tokenResponse) {
            // --- Determine if this is a silent restore or an explicit login ---
            const isSilent = _silentRestoreMode;
            _silentRestoreMode = false;
            const resolveRestore = _silentRestoreResolve;
            _silentRestoreResolve = null;
            const savedDriveId = _savedDriveIdForRestore;
            _savedDriveIdForRestore = null;

            // FIX: for explicit logins, verify the nonce set by signInWithGoogle().
            // This ensures the callback was triggered by the user, not by a
            // third-party page that somehow invoked the token client.
            if (!isSilent) {
                const expectedNonce = sessionStorage.getItem('oauth_nonce');
                sessionStorage.removeItem('oauth_nonce');
                if (!expectedNonce) {
                    showToast('طلب تسجيل دخول غير متوقع. يرجى المحاولة مجدداً', 'error');
                    hideLoadingScreen();
                    return;
                }
            }

            if (tokenResponse.error) {
                if (!isSilent) {
                    showToast('فشل تسجيل الدخول: ' + tokenResponse.error, 'error');
                }
                if (resolveRestore) resolveRestore(false);
                hideLoadingScreen();
                return;
            }

            // FIX: token is kept only in the JS variable — never written to storage.
            googleAccessToken = tokenResponse.access_token;
            _driveAuthExpired = false;

            if (!isSilent) setLoading('login', true);

            try {
                if (isSilent && savedDriveId) {
                    // Silent restore: reuse the saved file ID, skip the search/create call
                    driveFileId = savedDriveId;
                    await buildDriveDataSdk(); // see CHANGE H
                } else {
                    // Explicit login: find or create the Drive file normally
                    await initDriveDataSdk();
                }

                appState.storageMode = 'drive';
                const result = await window.dataSdk.init(dataHandler);

                if (result.isOk) {
                    appState.isAuthenticated = true;
                    appState.currentUser = { name: 'مدير النظام', email: '' };
                    appState.currentView = 'dashboard';
                    // FIX: only driveFileId is saved — no token in localStorage
                    authManager.saveSession(driveFileId);
                    if (!isSilent) showToast('تم تسجيل الدخول بنجاح', 'success');
                    if (resolveRestore) resolveRestore(true);
                } else {
                    if (!isSilent) showToast('فشل تحميل البيانات من Google Drive', 'error');
                    if (resolveRestore) resolveRestore(false);
                }
            } catch (error) {
                console.error('Google auth error:', error);
                if (!isSilent) showToast('حدث خطأ أثناء الاتصال بـ Google Drive', 'error');
                if (resolveRestore) resolveRestore(false);
            } finally {
                if (!isSilent) setLoading('login', false);
                hideLoadingScreen();
            }

        /* await loadScriptOnce('https://accounts.google.com/gsi/client'); */
        async function signInWithGoogle() {
            await loadScriptOnce('https://accounts.google.com/gsi/client');
            if (!tokenClient && !initGoogleAuth()) {
                showToast('مكتبة Google غير جاهزة، الرجاء المحاولة لاحقاً', 'error');
                return;
            }
            // FIX: store a one-time nonce so handleGoogleSignIn can verify
            // this callback was triggered by an explicit user action.
            const nonce = crypto.randomUUID();
            sessionStorage.setItem('oauth_nonce', nonce);
            showLoadingScreen();
            // 'select_account' forces the account chooser on explicit login
            tokenClient.requestAccessToken({ prompt: 'select_account' });
        }

        /**
         * Attempt a silent (no-popup) token refresh on page load.
         * If the user is still signed into Google, this succeeds without
         * any interaction. If they are not, it quietly fails and the app
         * falls back to localStorage mode.
         */
        async function tryRestoreSession() {
            const session = authManager.getSession();
            if (!session || !session.driveId) return false;

            if (!window.google?.accounts) return false;
            if (!tokenClient) initGoogleAuth();
            if (!tokenClient) return false;

            return new Promise((resolve) => {
                _silentRestoreMode = true;
                _silentRestoreResolve = resolve;
                _savedDriveIdForRestore = session.driveId;

                // Timeout: if Google doesn't respond in 8 s, give up gracefully
                const timeoutId = setTimeout(() => {
                    if (_silentRestoreMode) {
                        console.warn('[tryRestoreSession] timed out');
                        _silentRestoreMode = false;
                        _silentRestoreResolve = null;
                        _savedDriveIdForRestore = null;
                        hideLoadingScreen();
                        resolve(false);
                    }
                }, 8000);

                // Attach a one-time wrapper so the timeout can be cleared
                const originalResolve = resolve;
                _silentRestoreResolve = (result) => {
                    clearTimeout(timeoutId);
                    originalResolve(result);
                };

                // prompt: '' means silent — will NOT show a popup
                tokenClient.requestAccessToken({ prompt: '' });
            });
        }

        async function handleAdminAccess() {
            // Already signed in — go straight to dashboard
            if (appState.isAuthenticated) {
                appState.currentView = 'dashboard';
                render();
                return;
            }

            // Try a silent session restore first (no popup, no loading screen flash)
            const savedSession = authManager.getSession();
            if (savedSession && window.google?.accounts) {
                showLoadingScreen();
                try {
                    await tryRestoreSession();
                } catch (e) {
                    // Silent restore failed — fall through to login page
                }
                hideLoadingScreen();
            }

            // After restore attempt, either land on dashboard or show login
            appState.currentView = appState.isAuthenticated ? 'dashboard' : 'login';
            render();
        }

        /** Deep-clone model data for preview */
        function cloneModelData(data) {
            return JSON.parse(JSON.stringify(data));

        /** Apply adjustment: increase ALL prices by a percentage */
        function previewIncreaseAll() {
            const pctInput = document.getElementById('adj-all-pct');
            const pct = parseFloat(pctInput?.value) || 0;
            if (pct === 0) return;
            const model = appState._adjustModalModel;
            if (!model) return;
            const preview = cloneModelData(model.data);
            preview.forEach(cat => {
                cat.prices.forEach(p => {
                    if (p.price > 0) {
                        p.price = Math.round((p.price * (1 + pct / 100)) * 100) / 100;
                    }
                });
            });
            appState._adjustPreview = preview;
            appState._adjustPreviewLabel = pct > 0 ? `+${pct}%` : `${pct}%`;
            render();
        }

        /** Apply adjustment: increase specific category+size range by amount or percentage */
        function previewSectionAdjust() {
            const catSelect = document.getElementById('adj-section-cat');
            const catName = catSelect?.value || '';
            const sizeFrom = parseInt(document.getElementById('adj-section-from')?.value) || 22;
            const sizeTo = parseInt(document.getElementById('adj-section-to')?.value) || 56;
            const adjType = document.getElementById('adj-section-type')?.value || 'amount';
            const adjValue = parseFloat(document.getElementById('adj-section-value')?.value) || 0;

            if (adjValue === 0 || !catName) return;

            const model = appState._adjustModalModel;
            if (!model) return;

            const preview = cloneModelData(model.data);
            const cat = preview.find(c => c.name === catName);
            if (!cat) return;

            let affectedCount = 0;
            cat.prices.forEach(p => {
                if (p.size >= sizeFrom && p.size <= sizeTo && p.price > 0) {
                    if (adjType === 'amount') {
                        p.price = Math.round((p.price + adjValue) * 100) / 100;
                    } else {
                        p.price = Math.round((p.price * (1 + adjValue / 100)) * 100) / 100;
                    }
                    if (p.price < 0) p.price = 0;
                    affectedCount++;
                }
            });

            appState._adjustPreview = preview;
            const typeLabel = adjType === 'amount' ? `+${adjValue} ج.م` : `${adjValue > 0 ? '+' : ''}${adjValue}%`;
            appState._adjustPreviewLabel = `${catName} مقاس ${sizeFrom}-${sizeTo}: ${typeLabel} (${affectedCount} سعر)`;
            render();
        }

        function addBillItem() {
            const category = document.getElementById('billCategory').value;
            const isCustom = category === 'مخصص';
            const quantity = sanitizeNumericInput(document.getElementById(isCustom ? 'billQuantityCustom' : 'billQuantity').value, 0);

            if (!category || !quantity || quantity <= 0) return showToast('الرجاء تعبئة جميع الحقول المطلوبة', 'error');

            let unitPrice, displayCategory, displaySize;

            if (isCustom) {
                const customSize = document.getElementById('billCustomSize')?.value;
                const customPrice = sanitizeNumericInput(document.getElementById('billCustomPrice')?.value, 0);
                const customName = sanitizeTextInput(document.getElementById('billCustomName')?.value?.trim() || '');
                if (!customPrice || customPrice <= 0) return showToast('الرجاء إدخال سعر الوحدة', 'error');
                if (!customName) return showToast('الرجاء إدخال اسم الفئة', 'error');
                unitPrice = customPrice;
                displayCategory = customName;
                displaySize = sanitizeTextInput(customSize || '—');
            } else {
                const size = parseInt(document.getElementById('billSize').value);
                if (!size) return showToast('الرجاء اختيار المقاس', 'error');
                const categoryData = appState.selectedModel.data.find(c => c.name === category);
                if (!categoryData) return showToast('الفئة غير موجودة', 'error');
                const priceData = categoryData.prices.find(p => p.size === size);
                unitPrice = priceData ? priceData.price : 0;
                displayCategory = sanitizeTextInput(category);
                displaySize = size;
            }

            // IMPROVED #5: Warn if unit price is zero (missing from pricing model)
            if (unitPrice === 0 && !isCustom) {
                showToast(`تنبيه: سعر "${displayCategory}" مقاس ${displaySize} غير محدد في النموذج (سيُحفظ بسعر صفر)`, 'error');
                // Still allow adding — user may intentionally want a zero-price line
            }

            const total = unitPrice * quantity;
            appState.billItems.push({ category: displayCategory, size: displaySize, quantity, unitPrice, total, isCustom });

            let nextSize;
            const parsedSize = parseInt(displaySize);
            if (!isNaN(parsedSize) && parsedSize + 2 <= 56) nextSize = parsedSize + 2;
            else nextSize = displaySize;
            const customNamePersist = isCustom ? sanitizeTextInput(document.getElementById('billCustomName')?.value?.trim() || '') : '';
            appState.lastBillInput = { category, size: nextSize, quantity, customName: customNamePersist };
            render();
        }

            setLoading('saveBill', true);
            const billTotal = appState.billItems.reduce((sum, item) => sum + item.total, 0);
            const compactItems = compactBillItems(appState.billItems, appState.selectedModel);
            const sanitizedClientName = sanitizeClientNameInput(appState.currentBillClientName);
            const now = new Date().toISOString();
            let result;

        function buildBillPdfOptions(filename) {
            const isFileProtocol = window.location.protocol === 'file:';
            return {
                margin: 10,
                filename,
                image: { type: 'png', quality: 1.0 },
                html2canvas: {
                    scale: 3,

                    allowTaint: false,
                    letterRendering: true,
                    logging: false,
                    onclone: (clonedDoc) => {
                        const bill = clonedDoc.getElementById('printable-bill');
                        if (bill) {
                            bill.style.setProperty('width', '1100px', 'important');
                            bill.style.setProperty('min-width', '1100px', 'important');

                },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait', compress: true }
            };
        }

        function isCanvasSecurityError(error) {
            return error?.name === 'SecurityError' || String(error?.message || '').includes('Tainted canvases');
        }

        function blobToDataUrl(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }

        const TRANSPARENT_PIXEL_DATA_URI = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==';

        async function sanitizeImagesForPdf(root) {
            const images = Array.from(root.querySelectorAll('img'));
            const isFileProtocol = window.location.protocol === 'file:';
            await Promise.all(images.map(async (img) => {
                const src = img.getAttribute('src');
                if (!src || src.startsWith('data:')) return;
                try {
                    if (isFileProtocol) { img.setAttribute('src', TRANSPARENT_PIXEL_DATA_URI); img.removeAttribute('srcset'); return; }
                    const absoluteSrc = new URL(src, window.location.href).href;
                    const response = await fetch(absoluteSrc, { mode: 'cors', cache: 'force-cache' });
                    if (!response.ok) throw new Error(`Failed to fetch image: ${response.status}`);
                    const blob = await response.blob();
                    const dataUrl = await blobToDataUrl(blob);
                    img.setAttribute('src', dataUrl);
                    img.removeAttribute('srcset');
                    img.setAttribute('crossorigin', 'anonymous');
                } catch (error) {
                    img.setAttribute('src', TRANSPARENT_PIXEL_DATA_URI);
                    img.removeAttribute('srcset');
                }
            }));
        }

        async function withPdfSafeElement(sourceElement, callback) {
            const images = Array.from(sourceElement.querySelectorAll('img'));
            const originalState = images.map((img) => ({
                img,
                src: img.getAttribute('src'),
                srcset: img.getAttribute('srcset'),
                crossorigin: img.getAttribute('crossorigin')
            }));
            try {
                await sanitizeImagesForPdf(sourceElement);
                return await callback(sourceElement);
            } finally {
                originalState.forEach(({ img, src, srcset, crossorigin }) => {
                    if (src === null) img.removeAttribute('src'); else img.setAttribute('src', src);
                    if (srcset === null) img.removeAttribute('srcset'); else img.setAttribute('srcset', srcset);
                    if (crossorigin === null) img.removeAttribute('crossorigin'); else img.setAttribute('crossorigin', crossorigin);
                });
            }
        }

        async function runHtml2PdfWithFallback(element, opt, mode) {
            // IMPROVED #1: Ensure html2pdf is loaded before use
            await ensureHtml2Pdf();
            try {
                const worker = html2pdf().set(opt).from(element);
                if (mode === 'blob') return await worker.output('blob');
                await worker.save();
                return null;
            } catch (error) {
                if (!isCanvasSecurityError(error)) throw error;
                return await withPdfSafeElement(element, async (safeElement) => {
                    const worker = html2pdf().set(opt).from(safeElement);
                    if (mode === 'blob') return await worker.output('blob');
                    await worker.save();
                    return null;
                });
            }
        }

            if (!appState.currentBill) return;

            if (appState.loadingStates.sharing) return;

            const opt = buildBillPdfOptions(filename);

        }

        async function shareBill() {
            console.log('[shareBill] started');
            if (!appState.currentBill) { showToast('لا توجد فاتورة نشطة', 'error'); return; }
            const filename = `invoice_${appState.currentBill.billNumber}.pdf`;
            const opt = buildBillPdfOptions(filename);
            setLoading('sharing', true);
            await new Promise(r => requestAnimationFrame(r));
            const { container, element } = getBillPdfElements();
            if (!container || !element) { setLoading('sharing', false); showToast('تعذر العثور على محتوى الفاتورة للتصدير', 'error'); return; }
            try {
                let pdfBlob = appState.currentBillPdfBlob;
                if (!pdfBlob || pdfBlob.size === 0) {
                    appState.currentBillPdfBlob = null;
                    pdfBlob = await runHtml2PdfWithFallback(element, opt, 'blob');
                    if (pdfBlob && pdfBlob.size > 0) appState.currentBillPdfBlob = pdfBlob;
                }
                if (!pdfBlob || pdfBlob.size === 0) { showToast('فشل إنشاء ملف PDF', 'error'); return; }
                const file = new File([pdfBlob], filename, { type: 'application/pdf' });
                const canShareFiles = navigator.share && typeof navigator.canShare === 'function' && navigator.canShare({ files: [file] });
                if (canShareFiles) {
                    try {
                        await navigator.share({ files: [file], title: 'فاتورة الذهب الأبيض' });
                        showToast('تم فتح نافذة المشاركة', 'success');
                    } catch (shareErr) {
                        if (shareErr.name === 'AbortError') return;
                        throw shareErr;
                    }
                } else if (navigator.share) {
                    try {
                        await navigator.share({ title: 'فاتورة الذهب الأبيض', text: `فاتورة رقم ${appState.currentBill.billNumber} - الإجمالي: ${appState.currentBill.billTotal.toFixed(2)} جنيه` });
                        showToast('تمت مشاركة النص (مشاركة الملفات غير مدعومة)', 'info');
                    } catch (textShareErr) { if (textShareErr.name === 'AbortError') return; throw textShareErr; }
                } else {
                    const url = URL.createObjectURL(pdfBlob);
                    const a = document.createElement('a');
                    a.href = url; a.download = filename;
                    document.body.appendChild(a); a.click(); document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    showToast('تم التنزيل (مشاركة الملفات غير مدعومة على هذا الجهاز)', 'success');
                }
            } catch (error) {
                console.error('[shareBill] outer catch:', error.name, error.message);
                if (error.name === 'AbortError') return;
                const msg = String(error.message || '');
                if (error.name === 'NotAllowedError' || msg.includes('user gesture') || msg.includes('Must be handling') || msg.includes('NotAllowedError')) {
                    showToast('جاري التنزيل بدلاً من المشاركة (انتهت صلاحية الإجراء)', 'info');
                    try {
                        let fbBlob = appState.currentBillPdfBlob;
                        if (!fbBlob || fbBlob.size === 0) fbBlob = await runHtml2PdfWithFallback(element, opt, 'blob');
                        if (fbBlob && fbBlob.size > 0) {
                            const url = URL.createObjectURL(fbBlob);
                            const a = document.createElement('a'); a.href = url; a.download = filename;
                            document.body.appendChild(a); a.click(); document.body.removeChild(a);
                            URL.revokeObjectURL(url);
                        }
                    } catch (e2) { console.error('Fallback download error:', e2); }
                    return;
                }
                showToast('حدث خطأ أثناء المشاركة: ' + msg, 'error');
            } finally {
                setLoading('sharing', false);
                // Ensure the DOM re-renders after a share (page may have been backgrounded)
                requestAnimationFrame(() => render());
            }
        }

        async function shareBillImage() {
            console.log('[shareBillImage] started');
            if (!appState.currentBill) { showToast('لا توجد فاتورة نشطة', 'error'); return; }
            const filename = `invoice_${appState.currentBill.billNumber}.png`;
            setLoading('sharingImage', true);
            await new Promise(r => requestAnimationFrame(r));
            const { container, element } = getBillPdfElements();
            if (!container || !element) { setLoading('sharingImage', false); showToast('تعذر العثور على محتوى الفاتورة للتصدير', 'error'); return; }
            try {
                await ensureHtml2Pdf();
                await ensureHtml2Canvas(); // html2pdf.bundle does NOT expose html2canvas as a global
                const pdfOpt = buildBillPdfOptions(filename);

                // Use html2canvas directly for a reliable PNG capture.
                // html2pdf().output('img') goes through the PDF pipeline first and can produce
                // an empty/invalid image (the 214B bug).  html2canvas gives us a real Canvas.
                // Use a compact width for the shared image (similar to print/A4 layout)
                // so columns stay close together and the bill is easy to read.
                // The PDF onclone sets 1100px which is too wide for a share image.
                const IMAGE_BILL_WIDTH = 500;
                const h2cOpts = {
                    ...pdfOpt.html2canvas,
                    scale: 5,
                    useCORS: pdfOpt.html2canvas.useCORS,
                    allowTaint: false,
                    logging: false,
                    onclone: (clonedDoc) => {
                        const bill = clonedDoc.getElementById('printable-bill');
                        if (bill) {
                            bill.style.setProperty('width', IMAGE_BILL_WIDTH + 'px', 'important');
                            bill.style.setProperty('min-width', IMAGE_BILL_WIDTH + 'px', 'important');
                            bill.style.setProperty('max-width', 'none', 'important');
                            bill.style.setProperty('margin', '0 auto', 'important');
                            bill.style.setProperty('padding', '32px', 'important');
                            bill.style.setProperty('display', 'block', 'important');
                        }
                        // Fix html2canvas vertical-align bug on inline-block category badges
                        bill?.querySelectorAll('.bill-table tbody td').forEach(td => {
                            td.style.verticalAlign = 'middle';
                        });
                        bill?.querySelectorAll('.bill-table span[style*="background-color"], .bill-table span[style*="background-color"]').forEach(span => {
                            span.style.display = 'inline-flex';
                            span.style.alignItems = 'center';
                            span.style.lineHeight = '1';
                        });
                        const cloneApp = clonedDoc.getElementById('app');
                        if (cloneApp) cloneApp.classList.add('pdf-capture-mode');
                    }
                };

                let canvas;
                try {
                    canvas = await html2canvas(element, h2cOpts);
                } catch (canvasErr) {
                    if (isCanvasSecurityError(canvasErr)) {
                        canvas = await withPdfSafeElement(element, async (safeEl) => {
                            return await html2canvas(safeEl, h2cOpts);
                        });
                    } else {
                        throw canvasErr;
                    }
                }

                // Convert canvas to PNG blob directly (no data-URL round-trip)
                const blob = await new Promise((resolve, reject) => {
                    canvas.toBlob((b) => {
                        if (b) resolve(b); else reject(new Error('canvas.toBlob returned null'));
                    }, 'image/png', 1.0);
                });

                if (!blob || blob.size === 0) {
                    showToast('فشل إنشاء صورة الفاتورة', 'error');
                    return;
                }

                const file = new File([blob], filename, { type: 'image/png' });

                const canShareFiles = navigator.share && typeof navigator.canShare === 'function' && navigator.canShare({ files: [file] });
                if (canShareFiles) {
                    try {
                        // Wrap navigator.share with a timeout to prevent DOM freeze
                        // when share targets (e.g. WhatsApp Web) open a new window that hangs
                        const sharePromise = navigator.share({ files: [file], title: 'فاتورة الذهب الأبيض' });
                        const timeoutPromise = new Promise((_, reject) =>
                            setTimeout(() => reject(new Error('Share timed out')), 120000)
                        );
                        await Promise.race([sharePromise, timeoutPromise]);
                        showToast('تم فتح نافذة المشاركة', 'success');
                    } catch (shareErr) {
                        if (shareErr.name === 'AbortError') return;
                        // If share timed out or failed, fall through to download
                        if (shareErr.message === 'Share timed out') {
                            showToast('انتهت مهلة المشاركة، جاري التنزيل', 'info');
                        } else {
                            throw shareErr;
                        }
                    }
                    // If share succeeded or timed out, always download as fallback
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url; a.download = filename;
                    document.body.appendChild(a); a.click(); document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                } else if (navigator.share) {
                    // Can share but not files — share text info and download image
                    try {
                        await navigator.share({ title: 'فاتورة الذهب الأبيض', text: `فاتورة رقم ${appState.currentBill.billNumber} - الإجمالي: ${appState.currentBill.billTotal.toFixed(2)} جنيه` });
                        showToast('تمت مشاركة بيانات الفاتورة (مشاركة الصور غير مدعومة على هذا الجهاز)', 'info');
                    } catch (textShareErr) { if (textShareErr.name === 'AbortError') return; throw textShareErr; }
                    // Also download the image so the user has it
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a'); a.href = url; a.download = filename;
                    document.body.appendChild(a); a.click(); document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                } else {
                    // Fallback: download the image
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url; a.download = filename;
                    document.body.appendChild(a); a.click(); document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    showToast('تم تنزيل صورة الفاتورة', 'success');
                }
            } catch (error) {
                console.error('[shareBillImage] error:', error);
                if (error.name === 'AbortError') return;
                const msg = String(error.message || '');
                if (error.name === 'NotAllowedError' || msg.includes('user gesture') || msg.includes('Must be handling') || msg.includes('NotAllowedError')) {
                    showToast('جاري التنزيل بدلاً من المشاركة (انتهت صلاحية الإجراء)', 'info');
                    try {
                        const fbH2cOpts = {
                            ...buildBillPdfOptions(filename).html2canvas,
                            scale: 3,
                            onclone: (clonedDoc) => {
                                const bill = clonedDoc.getElementById('printable-bill');
                                if (bill) {
                                    bill.style.setProperty('width', '800px', 'important');
                                    bill.style.setProperty('min-width', '800px', 'important');
                                    bill.style.setProperty('max-width', 'none', 'important');
                                    bill.style.setProperty('margin', '0 auto', 'important');
                                    bill.style.setProperty('padding', '32px', 'important');
                                    bill.style.setProperty('display', 'block', 'important');
                                }
                                // Fix html2canvas vertical-align bug on inline-block category badges
                                bill?.querySelectorAll('.bill-table tbody td').forEach(td => {
                                    td.style.verticalAlign = 'middle';
                                });
                                bill?.querySelectorAll('.bill-table span[style*="background-color"]').forEach(span => {
                                    span.style.display = 'inline-flex';
                                    span.style.alignItems = 'center';
                                    span.style.lineHeight = '1';
                                });
                                const cloneApp = clonedDoc.getElementById('app');
                                if (cloneApp) cloneApp.classList.add('pdf-capture-mode');
                            }
                        };
                        const fbCanvas = await html2canvas(element, fbH2cOpts);
                        const fbBlob = await new Promise((resolve, reject) => {
                            fbCanvas.toBlob((b) => { if (b) resolve(b); else reject(new Error('toBlob null')); }, 'image/png', 1.0);
                        });
                        if (fbBlob && fbBlob.size > 0) {
                            const url = URL.createObjectURL(fbBlob);
                            const a = document.createElement('a'); a.href = url; a.download = filename;
                            document.body.appendChild(a); a.click(); document.body.removeChild(a);
                            URL.revokeObjectURL(url);
                        }
                    } catch (e2) { console.error('Image fallback download error:', e2); }
                    return;
                }
                showToast('حدث خطأ أثناء مشاركة الصورة', 'error');
            } finally {
                setLoading('sharingImage', false);
                // Ensure the DOM re-renders after a share (page may have been backgrounded)
                requestAnimationFrame(() => render());
            }
        }

        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function setLoading(key, isLoading) {
            appState.loadingStates[key] = isLoading;
            render(); // Now debounced — multiple rapid calls collapse into one frame update
        }

            document.body.appendChild(toast);

                                        <input type="file" id="settingsLogo" accept="image/svg+xml,image/png,image/jpeg,image/jpg" onchange="handleLogoUpload(event)" class="hidden">

                                        ${appState.companySettings.logo ? `<button type="button" onclick="removeLogo()" class="px-4 py-2 bg-red-500 rounded-lg font-semibold text-white text-sm">إزالة الشعار</button>` : ''}

                        <p class="text-slate-500 text-sm mb-4">عرض وتعديل جميع البيانات المخزنة في ملف JSON.</p>
                        <button onclick="appState.currentView = 'storage'; _storageRawData = null; _storageExpandedItem = null; render();" class="w-full py-3 rounded-lg font-bold text-white text-lg flex items-center justify-center gap-2" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                            <span>فتح بيانات التخزين</span><span>${WGIcon('arrowRight')}</span>

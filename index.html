        function loadOptionalSdkScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.async = true;
                script.onload = () => resolve(true);
                script.onerror = () => reject(new Error(`Failed to load script: ${src}`));
                document.head.appendChild(script);
            });
        }

        async function initOptionalSdks() {
            const isWebContext = window.location.protocol === 'http:' || window.location.protocol === 'https:';
            if (!isWebContext) {
                return;
            }

            const tasks = [
                loadOptionalSdkScript('/_sdk/data_sdk.js'),
                loadOptionalSdkScript('/_sdk/element_sdk.js')
            ];

            await Promise.allSettled(tasks);
        }

        // Bill template versioning: change this value to switch bill UI version.
        const BILL_TEMPLATE_VERSION = 'v7';
        const BILL_FALLBACK_TEMPLATE_VERSION = 'fallback';
        const BILL_TEMPLATE_FILES = {
            fallback: 'v3_Billing_only/bill_templates/template_fallback.js',
            v7: 'v3_Billing_only/bill_templates/template_v7.js'
        };
        let activeBillTemplate = null;

        function upsertBillTemplateStyles(cssText) {
            const styleId = 'bill-template-styles';
            let styleTag = document.getElementById(styleId);
            if (!styleTag) {
                styleTag = document.createElement('style');
                styleTag.id = styleId;
                document.head.appendChild(styleTag);
            }
            styleTag.textContent = cssText || '';
        }

        async function loadBillTemplate(version) {
            const resolvedVersion = BILL_TEMPLATE_FILES[version] ? version : BILL_FALLBACK_TEMPLATE_VERSION;
            const versionFile = BILL_TEMPLATE_FILES[resolvedVersion];
            if (!versionFile) {
                console.error('Unknown bill template version:', version);
                return;
            }

            if (!window.billTemplateRegistry) {
                window.billTemplateRegistry = {};
            }

            if (!window.billTemplateRegistry[resolvedVersion]) {
                await new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = `${versionFile}?v=${encodeURIComponent(resolvedVersion)}`;
                    script.async = true;
                    script.onload = resolve;
                    script.onerror = reject;
                    document.head.appendChild(script);
                });
            }

            activeBillTemplate = window.billTemplateRegistry[resolvedVersion] || null;

            if (resolvedVersion !== version) {
                console.error('Unknown bill template version, using fallback:', version);
            }

            if (activeBillTemplate?.styles) {
                upsertBillTemplateStyles(activeBillTemplate.styles);
            }

            if (activeBillTemplate?.preloadAssets) {
                await activeBillTemplate.preloadAssets(appState);
            }
        }

        // Mock SDK for local development

        // Google Drive Data SDK
        async function findOrCreateDriveFile() {
            const searchRes = await fetch(
                `https://www.googleapis.com/drive/v3/files?q=name='${DRIVE_FILE_NAME}' and trashed=false&spaces=drive`,
                { headers: { Authorization: `Bearer ${googleAccessToken}` } }
            );
            const searchData = await searchRes.json();
            if (searchData.files && searchData.files.length > 0) {
                return searchData.files[0].id;
            }
            const metadata = { name: DRIVE_FILE_NAME, mimeType: 'application/json' };
            const form = new FormData();
            form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
            form.append('file', new Blob(['[]'], { type: 'application/json' }));
            const createRes = await fetch(
                'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',
                {
                    method: 'POST',
                    headers: { Authorization: `Bearer ${googleAccessToken}` },
                    body: form
                }
            );
            const file = await createRes.json();
            return file.id;
        }

        async function readDriveFile() {
            const res = await fetch(
                `https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`,
                { headers: { Authorization: `Bearer ${googleAccessToken}` } }
            );
            if (!res.ok) {
                if (res.status === 401) {
                    showToast('انتهت صلاحية الجلسة، الرجاء تسجيل الدخول مرة أخرى', 'error');
                    logout();
                }
                throw new Error('Failed to read Drive file: ' + res.status);
            }
            const text = await res.text();
            return JSON.parse(text || '[]');
        }

        async function writeDriveFile(data) {
            const res = await fetch(
                `https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`,
                {
                    method: 'PATCH',
                    headers: {
                        Authorization: `Bearer ${googleAccessToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                }
            );
            if (!res.ok) {
                if (res.status === 401) {
                    showToast('انتهت صلاحية الجلسة، الرجاء تسجيل الدخول مرة أخرى', 'error');
                    logout();
                }
                throw new Error('Failed to write Drive file: ' + res.status);
            }
        }

        function addBillItem() {
            const category = document.getElementById('billCategory').value;
            const isCustom = category === 'مخصص';
            const quantity = parseFloat(document.getElementById(isCustom ? 'billQuantityCustom' : 'billQuantity').value);
            const tag = document.getElementById(isCustom ? 'billTagCustom' : 'billTag')?.value?.trim() || '';

            if (!category || !quantity || quantity <= 0) {
                return showToast('الرجاء تعبئة جميع الحقول المطلوبة', 'error');
            }

            let unitPrice, displayCategory, displaySize;

            if (isCustom) {
                const customSize = document.getElementById('billCustomSize')?.value;
                const customPrice = parseFloat(document.getElementById('billCustomPrice')?.value);
                const customName = document.getElementById('billCustomName')?.value?.trim();
                if (!customPrice || customPrice <= 0) return showToast('الرجاء إدخال سعر الوحدة', 'error');
                if (!customName) return showToast('الرجاء إدخال اسم الفئة', 'error');
                unitPrice = customPrice;
                displayCategory = customName;
                displaySize = customSize || '—';
            } else {
                const size = parseInt(document.getElementById('billSize').value);
                if (!size) return showToast('الرجاء اختيار المقاس', 'error');
                const categoryData = appState.selectedModel.data.find(c => c.name === category);
                if (!categoryData) return showToast('الفئة غير موجودة', 'error');
                const priceData = categoryData.prices.find(p => p.size === size);
                unitPrice = priceData ? priceData.price : 0;
                displayCategory = category;
                displaySize = size;
            }

            const total = unitPrice * quantity;
            appState.billItems.push({
                category: displayCategory,
                size: displaySize,
                quantity,
                unitPrice,
                total,
                tag,
                isCustom: isCustom
            });

            let nextSize;
            const parsedSize = parseInt(displaySize);
            if (!isNaN(parsedSize) && parsedSize + 2 <= 56) {
                nextSize = parsedSize + 2;
            } else {
                nextSize = displaySize;
            }
            const customNamePersist = isCustom ? document.getElementById('billCustomName')?.value?.trim() : '';
            appState.lastBillInput = { category, size: nextSize, quantity, tag, customName: customNamePersist };
            render();
        }

                if (!src || src.startsWith('data:')) return;

                try {
                    if (isFileProtocol) {
                        img.setAttribute('src', TRANSPARENT_PIXEL_DATA_URI);
                        img.removeAttribute('srcset');
                        return;
                    }

                    const absoluteSrc = new URL(src, window.location.href).href;
                    const response = await fetch(absoluteSrc, { mode: 'cors', cache: 'force-cache' });
                    if (!response.ok) throw new Error(`Failed to fetch image: ${response.status}`);
                    const blob = await response.blob();
                    const dataUrl = await blobToDataUrl(blob);
                    img.setAttribute('src', dataUrl);
                    img.removeAttribute('srcset');
                    img.setAttribute('crossorigin', 'anonymous');
                } catch (error) {
                    img.setAttribute('src', TRANSPARENT_PIXEL_DATA_URI);
                    img.removeAttribute('srcset');
                }
            }));
        }

        async function withPdfSafeElement(sourceElement, callback) {
            const images = Array.from(sourceElement.querySelectorAll('img'));
            const originalState = images.map((img) => ({
                img,
                src: img.getAttribute('src'),
                srcset: img.getAttribute('srcset'),
                crossorigin: img.getAttribute('crossorigin')
            }));

            try {
                await sanitizeImagesForPdf(sourceElement);
                return await callback(sourceElement);
            } finally {
                originalState.forEach(({ img, src, srcset, crossorigin }) => {
                    if (src === null) img.removeAttribute('src'); else img.setAttribute('src', src);
                    if (srcset === null) img.removeAttribute('srcset'); else img.setAttribute('srcset', srcset);
                    if (crossorigin === null) img.removeAttribute('crossorigin'); else img.setAttribute('crossorigin', crossorigin);
                });
            }
        }

        async function runHtml2PdfWithFallback(element, opt, mode) {
            try {
                const worker = html2pdf().set(opt).from(element);
                if (mode === 'blob') {
                    return await worker.output('blob');
                }
                await worker.save();
                return null;
            } catch (error) {
                if (!isCanvasSecurityError(error)) {
                    throw error;
                }

                return await withPdfSafeElement(element, async (safeElement) => {
                    const worker = html2pdf().set(opt).from(safeElement);
                    if (mode === 'blob') {
                        return await worker.output('blob');
                    }
                    await worker.save();
                    return null;
                });
            }
        }

        async function runBillPdfAction(loadingKey, action) {
            if (!appState.currentBill) {
                showToast('لا توجد فاتورة نشطة', 'error');
                return;
            }

            if (typeof html2pdf !== 'function') {
                showToast('مكتبة PDF غير متاحة حالياً', 'error');
                return;
            }

            const { container, element } = getBillPdfElements();
            if (!container || !element) {
                showToast('تعذر العثور على محتوى الفاتورة للتصدير', 'error');
                return;
            }

            const filename = `invoice_${appState.currentBill.billNumber}.pdf`;
            const opt = buildBillPdfOptions(filename);

            setLoading(loadingKey, true);
            container.classList.add('pdf-capture-mode');

            try {
                // Wait one paint so capture-mode styles are applied before PDF rendering.
                await new Promise(resolve => requestAnimationFrame(resolve));
                await action({ element, filename, opt });
            } finally {
                container.classList.remove('pdf-capture-mode');
                setLoading(loadingKey, false);
            }
        }


        async function preGenerateBillPdf() {
            if (!appState.currentBill) return;
            if (appState.currentBillPdfBlob && appState.currentBillPdfBlob.size > 0) return;
            if (appState.loadingStates.sharing) return; // don't conflict with active share

            // Get both container and element
            const { container, element } = getBillPdfElements();
            if (!container || !element) return;

            const filename = `invoice_${appState.currentBill.billNumber}.pdf`;
            const opt = buildBillPdfOptions(filename);

            // Apply capture mode to the container instead of document.body
            container.classList.add('pdf-capture-mode');
            try {
                // Wait for styles to apply before capturing
                await new Promise(resolve => requestAnimationFrame(resolve));
                const blob = await runHtml2PdfWithFallback(element, opt, 'blob');
                if (blob && blob.size > 0) {
                    appState.currentBillPdfBlob = blob;
                    console.log('[preGenerateBillPdf] cached:', blob.size, 'bytes');
                } else {
                    console.warn('[preGenerateBillPdf] empty blob generated');
                }
            } catch (e) {
                console.warn('[preGenerateBillPdf] failed:', e);
            } finally {
                container.classList.remove('pdf-capture-mode');
            }
        }

        async function shareBill() {
            console.log('[shareBill] started');
            if (!appState.currentBill) {
                showToast('لا توجد فاتورة نشطة', 'error');
                return;
            }
            if (typeof html2pdf !== 'function') {
                showToast('مكتبة PDF غير متاحة حالياً', 'error');
                return;
            }

            const filename = `invoice_${appState.currentBill.billNumber}.pdf`;
            const opt = buildBillPdfOptions(filename);

            setLoading('sharing', true);

            // Re-fetch element AFTER render() so we get the live DOM node
            await new Promise(r => requestAnimationFrame(r));
            const { container, element } = getBillPdfElements();
            if (!container || !element) {
                setLoading('sharing', false);
                showToast('تعذر العثور على محتوى الفاتورة للتصدير', 'error');
                return;
            }

            try {
                let pdfBlob = appState.currentBillPdfBlob;
                console.log('[shareBill] cached blob:', pdfBlob ? `${pdfBlob.size} bytes` : 'none');

                if (!pdfBlob || pdfBlob.size === 0) {
                    appState.currentBillPdfBlob = null; // clear invalid cache
                    container.classList.add('pdf-capture-mode');
                    try {
                        await new Promise(r => requestAnimationFrame(r));
                        pdfBlob = await runHtml2PdfWithFallback(element, opt, 'blob');
                        console.log('[shareBill] generated blob:', pdfBlob ? `${pdfBlob.size} bytes` : 'null');
                        if (pdfBlob && pdfBlob.size > 0) {
                            appState.currentBillPdfBlob = pdfBlob;
                        }
                    } finally {
                        container.classList.remove('pdf-capture-mode');
                    }
                }

                if (!pdfBlob || pdfBlob.size === 0) {
                    showToast('فشل إنشاء ملف PDF', 'error');
                    return;
                }

                const file = new File([pdfBlob], filename, { type: 'application/pdf' });
                console.log('[shareBill] File object:', file.size, 'bytes');

                // Check if native file sharing is actually supported
                const canShareFiles = navigator.share && typeof navigator.canShare === 'function' && navigator.canShare({ files: [file] });
                console.log('[shareBill] canShareFiles:', canShareFiles);

                if (canShareFiles) {
                    try {
                        await navigator.share({
                            files: [file],
                            title: 'فاتورة الذهب الأبيض'
                        });
                        showToast('تم فتح نافذة المشاركة', 'success');
                        console.log('[shareBill] share succeeded');
                    } catch (shareErr) {
                        console.log('[shareBill] share error:', shareErr.name, shareErr.message);
                        if (shareErr.name === 'AbortError') {
                            return; // user cancelled
                        }
                        // Fall through to download fallback
                        throw shareErr;
                    }
                } else if (navigator.share) {
                    // Browser has share API but doesn't support files — try text-only share
                    try {
                        await navigator.share({
                            title: 'فاتورة الذهب الأبيض',
                            text: `فاتورة رقم ${appState.currentBill.billNumber} - الإجمالي: ${appState.currentBill.billTotal.toFixed(2)} جنيه`
                        });
                        showToast('تمت مشاركة النص (مشاركة الملفات غير مدعومة)', 'info');
                    } catch (textShareErr) {
                        if (textShareErr.name === 'AbortError') return;
                        // Fall through to download
                        throw textShareErr;
                    }
                } else {
                    // No share API at all — download
                    const url = URL.createObjectURL(pdfBlob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    showToast('تم التنزيل (مشاركة الملفات غير مدعومة على هذا الجهاز)', 'success');
                }
            } catch (error) {
                console.error('[shareBill] outer catch:', error.name, error.message);
                if (error.name === 'AbortError') {
                    return;
                }
                const msg = String(error.message || '');
                if (error.name === 'NotAllowedError' || msg.includes('user gesture') || msg.includes('Must be handling') || msg.includes('NotAllowedError')) {
                    showToast('جاري التنزيل بدلاً من المشاركة (انتهت صلاحية الإجراء)', 'info');
                    try {
                        let fbBlob = appState.currentBillPdfBlob;
                        if (!fbBlob || fbBlob.size === 0) {
                            container.classList.add('pdf-capture-mode');
                            try {
                                await new Promise(r => requestAnimationFrame(r));
                                fbBlob = await runHtml2PdfWithFallback(element, opt, 'blob');
                            } finally {
                                container.classList.remove('pdf-capture-mode');
                            }
                        }
                        if (fbBlob && fbBlob.size > 0) {
                            const url = URL.createObjectURL(fbBlob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = filename;
                            document.body.appendChild(a);
                            a.click();
                            document.body.removeChild(a);
                            URL.revokeObjectURL(url);
                        }
                    } catch (e2) {
                        console.error('Fallback download error:', e2);
                    }
                    return;
                }
                showToast('حدث خطأ أثناء المشاركة: ' + msg, 'error');
            } finally {
                setLoading('sharing', false);
            }
        }

        async function importFromExcel(event) {
            const file = event.target.files[0];
            if (!file) return;
            setLoading('importExcel', true);
            try {
                const data = await file.arrayBuffer();
                const workbook = XLSX.read(data, { type: 'array' });
                const sheetName = workbook.SheetNames[0];
                const sheet = workbook.Sheets[sheetName];
                const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
                if (rows.length < 2) throw new Error('الملف فارغ أو لا يحتوي على بيانات');
                let headerRowIndex = -1, sizeColIndex = -1;
                const categoryMap = new Map();
                for (let i = 0; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row) continue;
                    const sizeIdx = row.findIndex(cell => cell && cell.toString().trim() === 'المقاس');
                    if (sizeIdx !== -1) {
                        headerRowIndex = i; sizeColIndex = sizeIdx;
                        for (let j = 0; j < row.length; j++) {
                            if (j === sizeIdx) continue;
                            let catName = row[j]?.toString().trim();
                            if (!catName) continue;
                            if (catName === 'نصفكم') catName = 'نصف كم';
                            if (catName === 'سبور') catName = 'حماله';
                            categoryMap.set(j, catName);
                        }
                        break;
                    }
                }
                if (headerRowIndex === -1) throw new Error('لم يتم العثور على صف الرأس الذي يحتوي على "المقاس"');
                const modelData = [];
                const categoryNames = Array.from(categoryMap.values());
                for (let catName of categoryNames) {
                    modelData.push({ name: catName, prices: SIZES.map(s => ({ size: s, price: 0 })) });
                }
                for (let i = headerRowIndex + 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row || row.length === 0) continue;
                    const sizeCell = row[sizeColIndex];
                    if (sizeCell === undefined || sizeCell === null) continue;
                    const size = parseInt(sizeCell);
                    if (isNaN(size) || !SIZES.includes(size)) continue;
                    for (let [colIdx, catName] of categoryMap.entries()) {
                        const priceCell = row[colIdx];
                        if (priceCell === undefined || priceCell === null || priceCell === '------' || priceCell === '') continue;
                        const price = parseFloat(priceCell);
                        if (isNaN(price)) continue;
                        const catData = modelData.find(c => c.name === catName);
                        if (catData) { const priceEntry = catData.prices.find(p => p.size === size); if (priceEntry) priceEntry.price = price; }
                    }
                }
                let modelName = file.name.replace(/\.[^/.]+$/, "");
                modelName = prompt("أدخل اسم النموذج:", modelName);
                if (!modelName || !modelName.trim()) { setLoading('importExcel', false); return; }
                const result = await window.dataSdk.create({ type: 'pricingModel', pricingModelName: modelName.trim(), pricingModelData: JSON.stringify(modelData), createdAt: new Date().toISOString() });
                showToast(result.isOk ? 'تم استيراد النموذج بنجاح' : 'حدث خطأ أثناء حفظ النموذج', result.isOk ? 'success' : 'error');
            } catch (err) {
                console.error(err);
                showToast('خطأ في قراءة الملف: ' + err.message, 'error');
            } finally {
                setLoading('importExcel', false);
                event.target.value = '';
                render();
            }
        }

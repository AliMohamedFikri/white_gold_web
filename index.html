        // Storage Data Management (unchanged from original)
        let _storageRawData = null;
        let _storageExpandedItem = null;
        let _storageLoading = false;

        function getTypeLabel(type) {
            const labels = { 'pricingModel': WGIcon('pricing') + ' نموذج تسعير', 'bill': WGIcon('bills') + ' فاتورة', 'settings': WGIcon('settings') + ' إعدادات', 'user': WGIcon('user') + ' مستخدم' };
            return labels[type] || WGIcon('edit') + ' ' + escapeHtml(type || 'غير معروف');
        }

        function getTypeBadgeColor(type) {
            const colors = { 'pricingModel': 'bg-indigo-100 text-indigo-800', 'bill': 'bg-emerald-100 text-emerald-800', 'settings': 'bg-amber-100 text-amber-800', 'user': 'bg-sky-100 text-sky-800' };
            return colors[type] || 'bg-gray-100 text-gray-800';
        }

        function getEntryTitle(entry) {
            if (entry.type === 'pricingModel') return entry.pricingModelName || 'بدون اسم';
            if (entry.type === 'bill') return (entry.bn || entry.billNumber || 'بدون رقم') + ' — ' + (entry.bc || entry.billClientName || 'بدون اسم');
            if (entry.type === 'settings') return 'إعدادات الشركة';
            if (entry.type === 'user') return entry.name || entry.email || 'مستخدم';
            return 'عنصر';
        }

        async function loadStorageRawData() {
            if (!window.dataSdk || !window.dataSdk.getRawData) return [];
            try {
                const data = await window.dataSdk.getRawData();
                _storageRawData = data;
                return data;
            } catch (e) {
                console.error('Failed to load raw data:', e);
                showToast('فشل تحميل بيانات التخزين', 'error');
                return [];
            }
        }

        async function storageToggleExpand(backendId) { _storageExpandedItem = _storageExpandedItem === backendId ? null : backendId; render(); }

        async function storageDeleteEntry(backendId) {
            if (!confirm('هل أنت متأكد من حذف هذا العنصر نهائياً؟ لا يمكن التراجع عن هذا الإجراء.')) return;
            setLoading('storageDelete', true);
            try {
                const data = await loadStorageRawData();
                const idx = data.findIndex(d => d.__backendId === backendId);
                if (idx < 0) {
                    for (const group of data) {
                        if (group.type === 'pricingModel' && Array.isArray(group.data)) {
                            const vIdx = group.data.findIndex(v => v.__backendId === backendId);
                            if (vIdx >= 0) {
                                group.data.splice(vIdx, 1);
                                if (group.data.length === 0) { const gIdx = data.indexOf(group); data.splice(gIdx, 1); }
                                break;
                            }
                        }
                    }
                } else {
                    data.splice(idx, 1);
                }
                await window.dataSdk.writeRawData(data);
                _storageRawData = data;
                _storageExpandedItem = null;
                showToast('تم الحذف بنجاح', 'success');
                render();
            } catch (e) {
                console.error('Delete failed:', e);
                showToast('فشل حذف العنصر', 'error');
            } finally {
                setLoading('storageDelete', false);
            }
        }

        async function storageDeletePricingGroup(groupName) {
            if (!confirm('هل أنت متأكد من حذف جميع إصدارات نموذج "' + groupName + '" نهائياً؟ لا يمكن التراجع.')) return;
            setLoading('storageDelete', true);
            try {
                const data = await loadStorageRawData();
                const filtered = data.filter(d => !(d.type === 'pricingModel' && d.pricingModelName === groupName));
                await window.dataSdk.writeRawData(filtered);
                _storageRawData = filtered;
                _storageExpandedItem = null;
                showToast('تم حذف النموذج بالكامل بنجاح', 'success');
                render();
            } catch (e) {
                console.error('Delete group failed:', e);
                showToast('فشل حذف النموذج', 'error');
            } finally {
                setLoading('storageDelete', false);
            }
        }

        async function storageRestoreVersion(groupName, backendId) {
            setLoading('storageRestore', true);
            try {
                const data = await loadStorageRawData();
                const group = data.find(d => d.type === 'pricingModel' && d.pricingModelName === groupName);
                if (group) {
                    const version = group.data.find(v => v.__backendId === backendId);
                    if (version) {
                        delete version.isDeleted;
                        await window.dataSdk.writeRawData(data);
                        _storageRawData = data;
                        showToast('تم استعادة الإصدار بنجاح', 'success');
                        render();
                        return;
                    }
                }
                showToast('لم يتم العثور على الإصدار', 'error');
            } catch (e) {
                console.error('Restore failed:', e);
                showToast('فشل استعادة الإصدار', 'error');
            } finally {
                setLoading('storageRestore', false);
            }
        }

        async function storageSaveEdit(backendId) {
            const editor = document.getElementById('storage-json-editor-' + backendId);
            if (!editor) return;
            let newData;
            try { newData = JSON.parse(editor.value); }
            catch (e) { showToast('JSON غير صالح — تأكد من الصيغة', 'error'); return; }
            setLoading('storageSave', true);
            try {
                const data = await loadStorageRawData();
                let found = false;
                const tIdx = data.findIndex(d => d.__backendId === backendId);
                if (tIdx >= 0) { data[tIdx] = newData; found = true; }
                if (!found) {
                    for (const group of data) {
                        if (group.type === 'pricingModel' && Array.isArray(group.data)) {
                            const vIdx = group.data.findIndex(v => v.__backendId === backendId);
                            if (vIdx >= 0) { group.data[vIdx] = newData; found = true; break; }
                        }
                    }
                }
                if (!found) { showToast('لم يتم العثور على العنصر', 'error'); return; }
                await window.dataSdk.writeRawData(data);
                _storageRawData = data;
                showToast('تم حفظ التعديلات بنجاح', 'success');
                render();
            } catch (e) {
                console.error('Save edit failed:', e);
                showToast('فشل حفظ التعديلات', 'error');
            } finally {
                setLoading('storageSave', false);
            }
        }

        async function storageToggleEdit(backendId) {
            const viewer = document.getElementById('storage-viewer-' + backendId);
            const editorWrap = document.getElementById('storage-editor-' + backendId);
            const btnEdit = document.getElementById('storage-btn-edit-' + backendId);
            if (viewer && editorWrap && btnEdit) {
                const isEditing = editorWrap.style.display !== 'none';
                viewer.style.display = isEditing ? 'block' : 'none';
                editorWrap.style.display = isEditing ? 'none' : 'block';
                btnEdit.innerHTML = isEditing ? WGIcon('edit') + ' تعديل' : WGIcon('view') + ' عرض';
                if (!isEditing) {
                    let entry = null;
                    if (_storageRawData) entry = _storageRawData.find(d => d.__backendId === backendId);
                    if (!entry) {
                        for (const group of (_storageRawData || [])) {
                            if (group.type === 'pricingModel' && Array.isArray(group.data)) {
                                const v = group.data.find(v => v.__backendId === backendId);
                                if (v) { entry = v; break; }
                            }
                        }
                    }
                    if (entry) document.getElementById('storage-json-editor-' + backendId).value = JSON.stringify(entry, null, 2);
                }
            }
        }

        async function storageExportJSON() {
            try {
                const data = await loadStorageRawData();
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = 'white_gold_app_data_backup.json';
                a.click(); URL.revokeObjectURL(url);
                showToast('تم تصدير البيانات بنجاح', 'success');
            } catch (e) { console.error('Export failed:', e); showToast('فشل تصدير البيانات', 'error'); }
        }

        async function storageImportJSON() {
            const input = document.createElement('input');
            input.type = 'file'; input.accept = '.json';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (!confirm('سيتم استبدال جميع البيانات الحالية بالملف المحدد. هل أنت متأكد؟')) return;
                try {
                    const text = await file.text();
                    const data = JSON.parse(text);
                    if (!Array.isArray(data)) { showToast('ملف JSON غير صالح — يجب أن يكون مصفوفة', 'error'); return; }
                    setLoading('storageImport', true);
                    await window.dataSdk.writeRawData(data);
                    _storageRawData = data; _storageExpandedItem = null;
                    showToast('تم استيراد البيانات بنجاح', 'success');
                    render();
                } catch (e) {
                    console.error('Import failed:', e);
                    showToast('فشل استيراد البيانات — تأكد من صحة الملف', 'error');
                } finally { setLoading('storageImport', false); }
            };
            input.click();
        }

        function renderStorage() {
            const config = window.elementSdk?.config || defaultConfig;
            const raw = _storageRawData;
            if (!raw) {
                if (_storageLoading) {
                    return `<div class="fade-in"><h1 class="text-4xl font-bold mb-8" style="color: ${config.text_color};">${WGIcon('storage')} بيانات التخزين</h1><div class="flex items-center gap-3 p-6 card-shadow rounded-xl bg-white"><div class="loading-spinner" style="border-top-color: ${config.primary_color};"></div><span class="font-semibold text-slate-600">جاري تحميل البيانات...</span></div></div>`;

        async function importFromExcel(event) {
            const file = event.target.files[0];
            if (!file) return;
            setLoading('importExcel', true);
            try {
                // IMPROVED #1: Lazy-load SheetJS on first Excel import
                await ensureSheetJS();
                const data = await file.arrayBuffer();
                const workbook = XLSX.read(data, { type: 'array' });
                const sheetName = workbook.SheetNames[0];
                const sheet = workbook.Sheets[sheetName];
                const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
                if (rows.length < 2) throw new Error('الملف فارغ أو لا يحتوي على بيانات');
                let headerRowIndex = -1, sizeColIndex = -1;
                const categoryMap = new Map();
                for (let i = 0; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row) continue;
                    const sizeIdx = row.findIndex(cell => cell && cell.toString().trim() === 'المقاس');
                    if (sizeIdx !== -1) {
                        headerRowIndex = i; sizeColIndex = sizeIdx;
                        for (let j = 0; j < row.length; j++) {
                            if (j === sizeIdx) continue;
                            let catName = row[j]?.toString().trim();
                            if (!catName) continue;
                            if (catName === 'نصفكم') catName = 'نصف كم';
                            if (catName === 'سبور') catName = 'حماله';
                            categoryMap.set(j, catName);
                        }
                        break;
                    }
                }
                if (headerRowIndex === -1) throw new Error('لم يتم العثور على صف الرأس الذي يحتوي على "المقاس"');
                const modelData = [];
                for (let catName of categoryMap.values()) modelData.push({ name: catName, prices: SIZES.map(s => ({ size: s, price: 0 })) });
                for (let i = headerRowIndex + 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row || row.length === 0) continue;
                    const sizeCell = row[sizeColIndex];
                    if (sizeCell === undefined || sizeCell === null) continue;
                    const size = parseInt(sizeCell);
                    if (isNaN(size) || !SIZES.includes(size)) continue;
                    for (let [colIdx, catName] of categoryMap.entries()) {
                        const priceCell = row[colIdx];
                        if (priceCell === undefined || priceCell === null || priceCell === '------' || priceCell === '') continue;
                        const price = parseFloat(priceCell);
                        if (isNaN(price)) continue;
                        const catData = modelData.find(c => c.name === catName);
                        if (catData) { const priceEntry = catData.prices.find(p => p.size === size); if (priceEntry) priceEntry.price = price; }
                    }
                }
                let modelName = file.name.replace(/\.[^/.]+$/, "");
                modelName = prompt("أدخل اسم النموذج:", modelName);
                if (!modelName || !modelName.trim()) { setLoading('importExcel', false); return; }
                const result = await window.dataSdk.create({ type: 'pricingModel', pricingModelName: modelName.trim(), pricingModelData: JSON.stringify(modelData), createdAt: new Date().toISOString() });
                showToast(result.isOk ? 'تم استيراد النموذج بنجاح' : 'حدث خطأ أثناء حفظ النموذج', result.isOk ? 'success' : 'error');
            } catch (err) {
                console.error(err);
                showToast('خطأ في قراءة الملف: ' + err.message, 'error');
            } finally {
                setLoading('importExcel', false);
                event.target.value = '';
                render();
            }
        }

        function confirmClientName() {
            const input = document.getElementById('billClientName');
            appState.currentBillClientName = sanitizeClientNameInput(input ? input.value : '');
            appState.billStep = 'items';
            render();
        }

        function backToModelSelect() { appState.selectedModel = null; appState.billStep = 'selectModel'; render(); }
        function backToClientName() { appState.billStep = 'clientName'; render(); }

        function cancelNewBill() {
            appState.currentView = 'bills';
            appState.lastBillInput = null;
            appState.editingBillId = null;
            appState.currentBillClientName = '';
            appState.selectedModel = null;
            appState.billStep = 'selectModel';
            appState.currentBillPdfBlob = null;
            render();
        }

        async function downloadBillPDF() {
            await runBillPdfAction('downloading', async ({ element, opt }) => {
                try {
                    await runHtml2PdfWithFallback(element, opt, 'save');
                    showToast('تم تنزيل PDF بنجاح', 'success');
                } catch (error) {
                    console.error('PDF download error:', error);
                    showToast('حدث خطأ أثناء تنزيل PDF', 'error');
                }
            });
        }

        // ============================================================
        // INIT — IMPROVED #3: Set _appReady = true AFTER templates load,
        // then call _doRender() directly (not through debounced render())
        // so the first paint is immediate and guaranteed.
        // ============================================================
        async function init() {
            initSecurityLayer();
            await initOptionalSdks();

            try {
                await loadBillTemplate(BILL_FALLBACK_TEMPLATE_VERSION);
                await loadBillTemplate(BILL_TEMPLATE_VERSION);
            } catch (error) {
                console.error('Failed to load bill template:', error);
                try { await loadBillTemplate(BILL_FALLBACK_TEMPLATE_VERSION); }
                catch (fallbackError) { console.error('Failed to load fallback bill template:', fallbackError); }
            }

            if (window.elementSdk) await window.elementSdk.init(element);

            // FIX: attempt a silent session restore before the first render.
            // If the user was previously signed in AND is still signed in to Google,
            // this silently obtains a fresh access token (no popup) and reconnects
            // to Drive. If it fails, the app falls back to localStorage mode.
            /* if (authManager.getSession()) {
                showLoadingScreen();
                // initGoogleAuth() must be called before tryRestoreSession()
                // because GIS needs to be ready
                if (window.google?.accounts) {
                    await tryRestoreSession();
                    initGoogleAuth();
                } else {
                    // GIS not yet loaded — wait up to 3 s then try
                    await new Promise(resolve => {
                        let attempts = 0;
                        const poll = setInterval(() => {
                            if (window.google?.accounts || ++attempts > 30) {
                                clearInterval(poll);
                                resolve();
                            }
                        }, 100);
                    });
                    if (window.google?.accounts) {
                        initGoogleAuth();
                        await tryRestoreSession();
                    }
                }
                hideLoadingScreen();
            } */

            // Notify the security module's AuthManager about the current user
            // so its inactivity timer and audit logging work correctly.
            if (appState.isAuthenticated && window.AuthManager?.setUser) {
                window.AuthManager.setUser(appState.currentUser || { email: '', name: '' });
            }

            // Mark app as ready and do the first render directly
            _appReady = true;
            _doRender(); // Always starts on landing page — no auth check here
        }

        init();

        // ── FIX: Clean up stale loading states when page regains focus ──
        // After navigator.share() hands off to WhatsApp (or any share target),
        // the page goes to the background.  When the user returns, the finally{}
        // block may have already run but the DOM wasn't repainted while hidden.
        // This listener forces a re-render on visibility change so buttons
        // un-stick from the "loading" state.
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                // Clear any lingering share-related loading states
                const shareKeys = ['sharing', 'sharingImage', 'downloading'];
                let dirty = false;
                shareKeys.forEach(key => {
                    if (appState.loadingStates[key]) {
                        appState.loadingStates[key] = false;
                        dirty = true;
                    }
                });
                if (dirty) render();
            }
        });
    </script>
</body>

<body class="h-full w-full">
    <div id="loading-screen" class="fixed inset-0 z-[100] flex items-center justify-center loading-overlay hidden">
        <div class="text-center">
            <div
                class="w-12 h-12 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto mb-4">
            </div>
            <p class="text-slate-600 font-bold">جاري التحقق من الجلسة...</p>
        </div>
    </div>

    <div id="app" class="h-full w-full overflow-auto"></div>
    <script>
        // ============================================================
        // IMPROVED #1: Lazy-load heavy libraries on first use
        // Previously: html2pdf (~800KB) and SheetJS (~550KB) were loaded
        // synchronously on every page visit, blocking the parser.
        // Now they are loaded only when first needed.
        // ============================================================
        const _lazyScripts = {};

        function loadScriptOnce(src) {
            if (_lazyScripts[src]) return _lazyScripts[src];
            _lazyScripts[src] = new Promise((resolve, reject) => {
                // Already present in DOM (e.g. loaded synchronously elsewhere)
                if (document.querySelector(`script[src="${src}"]`) && window[_scriptGlobalName(src)]) {
                    resolve();
                    return;
                }
                const script = document.createElement('script');
                script.src = src;
                script.async = true;
                script.onload = resolve;
                script.onerror = () => reject(new Error(`Failed to load: ${src}`));
                document.head.appendChild(script);
            });
            return _lazyScripts[src];
        }

        function _scriptGlobalName(src) {
            if (src.includes('html2pdf')) return 'html2pdf';
            if (src.includes('xlsx')) return 'XLSX';
            return '';
        }

        async function ensureHtml2Pdf() {
            if (typeof html2pdf === 'function') return;
            await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js');
        }

        async function ensureSheetJS() {
            if (typeof XLSX !== 'undefined') return;
            await loadScriptOnce('https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js');
        }

        // ============================================================
        // IMPROVED #2: Debounced render — batch all state changes
        // into a single DOM update per animation frame.
        // Previously: every setLoading() call triggered a full
        // innerHTML rebuild, causing visible flicker.
        // ============================================================
        let _renderPending = false;

        // IMPROVED #3: Guard render() until templates are ready.
        // Previously: render() could be called before bill templates
        // finished loading, showing broken UI for ~200ms.
        let _appReady = false;

        function render() {
            if (_renderPending) return; // already queued
            _renderPending = true;
            requestAnimationFrame(() => {
                _renderPending = false;
                if (!_appReady) return; // templates not loaded yet — skip
                _doRender();
            });
        }

        // The actual render logic, extracted so it can be called
        // directly once during init (after _appReady = true).
        function _doRender() {
            const app = document.getElementById('app');
            if (!app) return;

            if (appState.currentView === 'landing') {
                app.innerHTML = renderLanding();
                return;
            }

            if (!appState.isAuthenticated) {
                app.innerHTML = renderLogin();
            } else {
                app.innerHTML = renderDashboardLayout();
                attachEventListeners();
            }

            if (appState.currentView === 'viewBill') {
                setTimeout(() => {
                    if (appState.currentView === 'viewBill' && !appState.currentBillPdfBlob) {
                        requestAnimationFrame(() => preGenerateBillPdf());
                    }
                });
            }
        }

        function setupImageFallback(imgElement, productName) {
            if (!imgElement) return;
            imgElement.addEventListener('error', function() {
                imgElement.style.display = 'none';
            }, { once: true });
        }

        function loadOptionalSdkScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.async = true;
                script.onload = () => resolve(true);
                script.onerror = () => reject(new Error(`Failed to load script: ${src}`));
                document.head.appendChild(script);
            });
        }

        async function initOptionalSdks() {
            const isWebContext = window.location.protocol === 'http:' || window.location.protocol === 'https:';
            if (!isWebContext) return;
            const tasks = [
                loadOptionalSdkScript('/_sdk/data_sdk.js'),
                loadOptionalSdkScript('/_sdk/element_sdk.js')
            ];
            await Promise.allSettled(tasks);
        }

        // Bill template versioning
        const BILL_TEMPLATE_VERSION = 'v7';
        const BILL_FALLBACK_TEMPLATE_VERSION = 'fallback';
        const BILL_TEMPLATE_FILES = {
            fallback: 'bill_templates/template_fallback.js',
            v7: 'bill_templates/template_v7.js'
        };
        let activeBillTemplate = null;

        function upsertBillTemplateStyles(cssText) {
            const styleId = 'bill-template-styles';
            let styleTag = document.getElementById(styleId);
            if (!styleTag) {
                styleTag = document.createElement('style');
                styleTag.id = styleId;
                document.head.appendChild(styleTag);
            }
            styleTag.textContent = cssText || '';
        }

        async function loadBillTemplate(version) {
            const resolvedVersion = BILL_TEMPLATE_FILES[version] ? version : BILL_FALLBACK_TEMPLATE_VERSION;
            const versionFile = BILL_TEMPLATE_FILES[resolvedVersion];
            if (!versionFile) {
                console.error('Unknown bill template version:', version);
                return;
            }

            if (!window.billTemplateRegistry) window.billTemplateRegistry = {};

            if (!window.billTemplateRegistry[resolvedVersion]) {
                await new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = `${versionFile}?v=${encodeURIComponent(resolvedVersion)}`;
                    script.async = true;
                    script.onload = resolve;
                    script.onerror = reject;
                    document.head.appendChild(script);
                });
            }

            activeBillTemplate = window.billTemplateRegistry[resolvedVersion] || null;

            if (resolvedVersion !== version) {
                console.error('Unknown bill template version, using fallback:', version);
            }

            if (activeBillTemplate?.styles) upsertBillTemplateStyles(activeBillTemplate.styles);
            if (activeBillTemplate?.preloadAssets) await activeBillTemplate.preloadAssets(appState);
        }

        // Secure storage wrappers
        function storageSet(key, value, userScope = null) {
            if (window.SecureStorage?.setItem) return window.SecureStorage.setItem(key, value, userScope);
            localStorage.setItem(key, value);
            return true;
        }

        function storageGet(key, userScope = null) {
            if (window.SecureStorage?.getItem) return window.SecureStorage.getItem(key, userScope);
            return localStorage.getItem(key);
        }

        function storageRemove(key, userScope = null) {
            if (window.SecureStorage?.removeItem) return window.SecureStorage.removeItem(key, userScope);
            localStorage.removeItem(key);
            return true;
        }

        function sanitizeTextInput(value) {
            if (window.SecurityUtils?.sanitizeHTML) return window.SecurityUtils.sanitizeHTML(value || '');
            return escapeHtml(value || '');
        }

        function sanitizeClientNameInput(value) {
            if (window.SecurityUtils?.sanitizeClientName) return window.SecurityUtils.sanitizeClientName(value || '');
            return String(value || '').trim();
        }

        function sanitizeNumericInput(value, defaultValue = 0) {
            if (window.SecurityUtils?.sanitizeNumber) return window.SecurityUtils.sanitizeNumber(value, defaultValue);
            const num = parseFloat(value);
            return isNaN(num) ? defaultValue : num;
        }

        function isRateLimitExceeded(action, message) {
            if (window.RateLimiter?.isAllowed && !window.RateLimiter.isAllowed(action)) {
                showToast(message || 'تم تجاوز الحد الأقصى للطلبات. يرجى المحاولة لاحقاً', 'error');
                window.AuditLog?.log?.('rate_limited_action_blocked', { action });
                return true;
            }
            return false;
        }

        function initSecurityLayer() {
            window.AuthManager?.init?.();
            window.AuditLog?.log?.('app_security_layer_initialized');
        }

        // Auth / Session Manager
        const authManager = {
            saveSession(token, driveId) {
                storageSet('wg_session_token', token);
                storageSet('wg_drive_id', driveId);
                storageSet('wg_last_login', String(Date.now()));
                window.AuditLog?.log?.('session_saved', { driveId: !!driveId });
            },
            clearSession() {
                storageRemove('wg_session_token');
                storageRemove('wg_drive_id');
                storageRemove('wg_last_login');
                window.AuditLog?.log?.('session_cleared');
            },
            getSession() {
                const token = storageGet('wg_session_token');
                const driveId = storageGet('wg_drive_id');
                return (token && driveId) ? { token, driveId } : null;
            }
        };

        // Sync Manager
        const syncManager = {
            enrich(item) {
                return { ...item, lastSyncedAt: new Date().toISOString(), syncStatus: 'synced' };
            },
            getBadge(item) {
                const timeSource = item?.lastSyncedAt || item?.updatedAt || item?.billDate || item?.createdAt;
                if (!timeSource) return '';
                const time = new Date(timeSource).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
                return `<span class="sync-badge sync-success">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                            مؤمن ${time}
                        </span>`;
            }
        };

        // ============================================================
        // IMPROVED #4 (UX): Smarter Drive 401 handling
        // Previously: 401 showed a toast and called logout() immediately,
        // losing all unsaved state. Now we set a flag and show a persistent
        // re-auth banner at the top of the dashboard so the user can
        // consciously decide when to re-authenticate.
        // ============================================================
        let _driveAuthExpired = false;

        function handleDriveAuthError() {
            _driveAuthExpired = true;
            render(); // banner will appear in dashboard layout
        }

        async function findOrCreateDriveFile() {
            if (isRateLimitExceeded('google_drive_search', 'تم تجاوز الحد الأقصى للطلبات. يرجى المحاولة لاحقاً')) {
                throw new Error('Rate limit exceeded: google_drive_search');
            }
            const searchRes = await fetch(
                `https://www.googleapis.com/drive/v3/files?q=name='${DRIVE_FILE_NAME}' and trashed=false&spaces=drive`,
                { headers: { Authorization: `Bearer ${googleAccessToken}` } }
            );
            const searchData = await searchRes.json();
            if (searchData.files && searchData.files.length > 0) return searchData.files[0].id;
            const metadata = { name: DRIVE_FILE_NAME, mimeType: 'application/json' };
            const form = new FormData();
            form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
            form.append('file', new Blob(['[]'], { type: 'application/json' }));
            if (isRateLimitExceeded('google_drive_create_file', 'تم تجاوز الحد الأقصى لعمليات الإنشاء. يرجى المحاولة لاحقاً')) {
                throw new Error('Rate limit exceeded: google_drive_create_file');
            }
            const createRes = await fetch(
                'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',
                {
                    method: 'POST',
                    headers: { Authorization: `Bearer ${googleAccessToken}` },
                    body: form
                }
            );
            const file = await createRes.json();
            return file.id;
        }

        async function readDriveFile() {
            if (isRateLimitExceeded('google_drive_read', 'تم تجاوز الحد الأقصى لعمليات القراءة. يرجى المحاولة لاحقاً')) {
                throw new Error('Rate limit exceeded: google_drive_read');
            }
            const res = await fetch(
                `https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`,
                { headers: { Authorization: `Bearer ${googleAccessToken}` } }
            );
            if (!res.ok) {
                if (res.status === 401) {
                    // IMPROVED: non-destructive 401 handling
                    handleDriveAuthError();
                }
                throw new Error('Failed to read Drive file: ' + res.status);
            }
            const text = await res.text();
            return JSON.parse(text || '[]');
        }

        async function writeDriveFile(data) {
            if (isRateLimitExceeded('google_drive_write', 'تم تجاوز الحد الأقصى لعمليات الحفظ. يرجى المحاولة لاحقاً')) {
                throw new Error('Rate limit exceeded: google_drive_write');
            }
            const res = await fetch(
                `https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`,
                {
                    method: 'PATCH',
                    headers: {
                        Authorization: `Bearer ${googleAccessToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                }
            );
            if (!res.ok) {
                if (res.status === 401) {
                    // IMPROVED: non-destructive 401 handling
                    handleDriveAuthError();
                }
                throw new Error('Failed to write Drive file: ' + res.status);
            }
        }

        // Migration: convert old flat pricing model format to grouped-by-name format
        function migrateToGroupedFormat(data) {
            if (!Array.isArray(data)) return [];
            const hasOldFormat = data.some(d => d.type === 'pricingModel' && !Array.isArray(d.data));
            if (!hasOldFormat) return data;
            const modelGroups = {};
            const otherData = [];
            for (const item of data) {
                if (item.type === 'pricingModel' && !Array.isArray(item.data)) {
                    const name = item.pricingModelName;
                    if (!modelGroups[name]) modelGroups[name] = { type: 'pricingModel', pricingModelName: name, data: [] };
                    modelGroups[name].data.push({
                        pricingModelData: item.pricingModelData,
                        createdAt: item.createdAt,
                        updatedAt: item.updatedAt,
                        __backendId: item.__backendId
                    });
                } else {
                    otherData.push(item);
                }
            }
            return [...otherData, ...Object.values(modelGroups)];
        }

        async function initDriveDataSdk() {
            driveFileId = await findOrCreateDriveFile();
            let data = await readDriveFile();
            if (!Array.isArray(data)) data = [];
            data = migrateToGroupedFormat(data);
            await writeDriveFile(data);

            window.dataSdk = {
                init: async (handler) => {
                    window._dataHandler = handler;
                    handler.onDataChanged(data);
                    return { isOk: true };
                },
                create: async (item) => {
                    const data = await readDriveFile();
                    const now = new Date().toISOString();
                    const newItem = { ...item, updatedAt: item.updatedAt || now, __backendId: Date.now().toString() };
                    if (item.type === 'bill') {
                        delete newItem.items;
                        data.push(newItem);
                    } else if (item.type === 'pricingModel') {
                        const versionData = {
                            pricingModelData: newItem.pricingModelData,
                            createdAt: newItem.createdAt || now,
                            updatedAt: now,
                            __backendId: newItem.__backendId
                        };
                        let group = data.find(d => d.type === 'pricingModel' && d.pricingModelName === newItem.pricingModelName);
                        if (group) {
                            group.data.push(versionData);
                        } else {
                            data.push({ type: 'pricingModel', pricingModelName: newItem.pricingModelName, data: [versionData] });
                        }
                    } else {
                        newItem.createdAt = item.createdAt || now;
                        data.push(newItem);
                    }
                    await writeDriveFile(data);
                    if (window._dataHandler) window._dataHandler.onDataChanged(data);
                    return { isOk: true, id: newItem.__backendId };
                },
                update: async (item) => {
                    const data = await readDriveFile();
                    const now = new Date().toISOString();
                    if (item.type === 'pricingModel') {
                        const group = data.find(d => d.type === 'pricingModel' && d.pricingModelName === item.pricingModelName);
                        if (group) {
                            const vIdx = group.data.findIndex(v => v.__backendId === item.__backendId);
                            if (vIdx >= 0) {
                                group.data[vIdx] = { ...group.data[vIdx], pricingModelData: item.pricingModelData, updatedAt: now };
                                await writeDriveFile(data);
                                if (window._dataHandler) window._dataHandler.onDataChanged(data);
                                return { isOk: true };
                            }
                        }
                        return { isOk: false };
                    }
                    let index = data.findIndex(d => d.__backendId === item.__backendId);
                    if (index < 0) index = data.findIndex(d => d.type === 'bill' && (d.billNumber === item.billNumber || d.bn === item.billNumber));
                    if (index >= 0) {
                        const originalItem = data[index] || {};
                        const updatedItem = { ...originalItem, ...item, updatedAt: now };
                        if ((updatedItem.type || item.type) === 'bill') {
                            delete updatedItem.createdAt;
                            delete updatedItem.items;
                        } else {
                            updatedItem.createdAt = originalItem.createdAt || item.createdAt || now;
                        }
                        data[index] = updatedItem;
                        await writeDriveFile(data);
                        if (window._dataHandler) window._dataHandler.onDataChanged(data);
                        return { isOk: true };
                    }
                    return { isOk: false };
                },
                delete: async (item) => {
                    let data = await readDriveFile();
                    if (item.type === 'pricingModel') {
                        const group = data.find(d => d.type === 'pricingModel' && d.pricingModelName === item.pricingModelName);
                        if (group) {
                            const vIdx = group.data.findIndex(v => v.__backendId === item.__backendId);
                            if (vIdx >= 0) {
                                group.data[vIdx].isDeleted = true;
                                await writeDriveFile(data);
                                if (window._dataHandler) window._dataHandler.onDataChanged(data);
                                return { isOk: true };
                            }
                        }
                        return { isOk: false };
                    }
                    data = data.filter(d => d.__backendId !== item.__backendId);
                    await writeDriveFile(data);
                    if (window._dataHandler) window._dataHandler.onDataChanged(data);
                    return { isOk: true };
                },
                getRawData: async () => await readDriveFile(),
                writeRawData: async (data) => {
                    await writeDriveFile(data);
                    if (window._dataHandler) window._dataHandler.onDataChanged(data);
                    return { isOk: true };
                }
            };
        }

        if (!window.dataSdk) {
            window.dataSdk = {
                init: async (handler) => {
                    window._dataHandler = handler;
                    let data = JSON.parse(storageGet('app_data') || '[]');
                    data = migrateToGroupedFormat(data);
                    storageSet('app_data', JSON.stringify(data));
                    handler.onDataChanged(data);
                    return { isOk: true };
                },
                create: async (item) => {
                    const data = JSON.parse(storageGet('app_data') || '[]');
                    const now = new Date().toISOString();
                    const newItem = { ...item, updatedAt: item.updatedAt || now, __backendId: Date.now().toString() };
                    if (item.type === 'bill') {
                        delete newItem.items;
                        data.push(newItem);
                    } else if (item.type === 'pricingModel') {
                        const versionData = {
                            pricingModelData: newItem.pricingModelData,
                            createdAt: newItem.createdAt || now,
                            updatedAt: now,
                            __backendId: newItem.__backendId
                        };
                        let group = data.find(d => d.type === 'pricingModel' && d.pricingModelName === newItem.pricingModelName);
                        if (group) {
                            group.data.push(versionData);
                        } else {
                            data.push({ type: 'pricingModel', pricingModelName: newItem.pricingModelName, data: [versionData] });
                        }
                    } else {
                        newItem.createdAt = item.createdAt || now;
                        data.push(newItem);
                    }
                    storageSet('app_data', JSON.stringify(data));
                    if (window._dataHandler) window._dataHandler.onDataChanged(data);
                    return { isOk: true, id: newItem.__backendId };
                },
                update: async (item) => {
                    const data = JSON.parse(storageGet('app_data') || '[]');
                    const now = new Date().toISOString();
                    if (item.type === 'pricingModel') {
                        const group = data.find(d => d.type === 'pricingModel' && d.pricingModelName === item.pricingModelName);
                        if (group) {
                            const vIdx = group.data.findIndex(v => v.__backendId === item.__backendId);
                            if (vIdx >= 0) {
                                group.data[vIdx] = { ...group.data[vIdx], pricingModelData: item.pricingModelData, updatedAt: now };
                                storageSet('app_data', JSON.stringify(data));
                                if (window._dataHandler) window._dataHandler.onDataChanged(data);
                                return { isOk: true };
                            }
                        }
                        return { isOk: false };
                    }
                    let index = data.findIndex(d => d.__backendId === item.__backendId);
                    if (index < 0) index = data.findIndex(d => d.type === 'bill' && (d.billNumber === item.billNumber || d.bn === item.billNumber));
                    if (index >= 0) {
                        const originalItem = data[index] || {};
                        const updatedItem = { ...originalItem, ...item, updatedAt: now };
                        if ((updatedItem.type || item.type) === 'bill') {
                            delete updatedItem.createdAt;
                            delete updatedItem.items;
                        } else {
                            updatedItem.createdAt = originalItem.createdAt || item.createdAt || now;
                        }
                        data[index] = updatedItem;
                        storageSet('app_data', JSON.stringify(data));
                        if (window._dataHandler) window._dataHandler.onDataChanged(data);
                        return { isOk: true };
                    }
                    return { isOk: false };
                },
                delete: async (item) => {
                    let data = JSON.parse(storageGet('app_data') || '[]');
                    if (item.type === 'pricingModel') {
                        const group = data.find(d => d.type === 'pricingModel' && d.pricingModelName === item.pricingModelName);
                        if (group) {
                            const vIdx = group.data.findIndex(v => v.__backendId === item.__backendId);
                            if (vIdx >= 0) {
                                group.data[vIdx].isDeleted = true;
                                storageSet('app_data', JSON.stringify(data));
                                if (window._dataHandler) window._dataHandler.onDataChanged(data);
                                return { isOk: true };
                            }
                        }
                        return { isOk: false };
                    }
                    data = data.filter(d => d.__backendId !== item.__backendId);
                    storageSet('app_data', JSON.stringify(data));
                    if (window._dataHandler) window._dataHandler.onDataChanged(data);
                    return { isOk: true };
                },
                getRawData: async () => JSON.parse(storageGet('app_data') || '[]'),
                writeRawData: async (data) => {
                    storageSet('app_data', JSON.stringify(data));
                    if (window._dataHandler) window._dataHandler.onDataChanged(data);
                    return { isOk: true };
                }
            };

            return items.map(item => {

                    const sizeVal = (item.size === '—' || item.size === '—') ? -1 : (typeof item.size === 'number' ? item.size : parseInt(item.size) || -1);
                    return { n: item.category, s: sizeVal, q: item.quantity, p: item.unitPrice };
                } else {
                    const catIndex = selectedModel ? selectedModel.data.findIndex(c => c.name === item.category) : -1;
                    return { c: catIndex >= 0 ? catIndex : 0, s: typeof item.size === 'number' ? item.size : parseInt(item.size), q: item.quantity, p: item.unitPrice };
                }
            });
        }

        function expandBillItems(items, allModels) {
            return items.map(item => {
                if (item.c !== undefined && item.c !== null) {
                    let catName = 'غير معروف';
                    if (allModels && allModels.length > 0) catName = allModels[0].data[item.c]?.name || catName;
                    return { category: catName, size: item.s, quantity: item.q, unitPrice: item.p, total: item.q * item.p, isCustom: false };
                } else {
                    return { category: item.n || '', size: item.s === -1 ? '—' : item.s, quantity: item.q, unitPrice: item.p, total: item.q * item.p, isCustom: true };
                }
            });

        function getMonthlyStats() {
            const stats = {};
            appState.bills.forEach(bill => {
                const date = new Date(bill.createdAt || bill.billDate || Date.now());
                const key = date.toLocaleDateString('ar-EG', { month: 'long', year: 'numeric' });
                if (!stats[key]) stats[key] = { count: 0, total: 0, items: 0 };
                stats[key].count++;
                stats[key].total += parseFloat(bill.billTotal || 0);
                const items = bill.items || normalizeBillItems(bill.billItems);
                items.forEach(i => stats[key].items += (parseFloat(i.quantity) || 0));
            });
            return stats;
        }

            } finally {
                setLoading('login', false);

        function addBillItem() {
            const category = document.getElementById('billCategory').value;
            const isCustom = category === 'مخصص';
            const quantity = sanitizeNumericInput(document.getElementById(isCustom ? 'billQuantityCustom' : 'billQuantity').value, 0);

            if (!category || !quantity || quantity <= 0) return showToast('الرجاء تعبئة جميع الحقول المطلوبة', 'error');

            let unitPrice, displayCategory, displaySize;

            if (isCustom) {
                const customSize = document.getElementById('billCustomSize')?.value;
                const customPrice = sanitizeNumericInput(document.getElementById('billCustomPrice')?.value, 0);
                const customName = sanitizeTextInput(document.getElementById('billCustomName')?.value?.trim() || '');
                if (!customPrice || customPrice <= 0) return showToast('الرجاء إدخال سعر الوحدة', 'error');
                if (!customName) return showToast('الرجاء إدخال اسم الفئة', 'error');
                unitPrice = customPrice;
                displayCategory = customName;
                displaySize = sanitizeTextInput(customSize || '—');
            } else {
                const size = parseInt(document.getElementById('billSize').value);
                if (!size) return showToast('الرجاء اختيار المقاس', 'error');
                const categoryData = appState.selectedModel.data.find(c => c.name === category);
                if (!categoryData) return showToast('الفئة غير موجودة', 'error');
                const priceData = categoryData.prices.find(p => p.size === size);
                unitPrice = priceData ? priceData.price : 0;
                displayCategory = sanitizeTextInput(category);
                displaySize = size;
            }

            // IMPROVED #5: Warn if unit price is zero (missing from pricing model)
            if (unitPrice === 0 && !isCustom) {
                showToast(`تنبيه: سعر "${displayCategory}" مقاس ${displaySize} غير محدد في النموذج (سيُحفظ بسعر صفر)`, 'error');
                // Still allow adding — user may intentionally want a zero-price line
            }

            const total = unitPrice * quantity;
            appState.billItems.push({ category: displayCategory, size: displaySize, quantity, unitPrice, total, isCustom });

            let nextSize;
            const parsedSize = parseInt(displaySize);
            if (!isNaN(parsedSize) && parsedSize + 2 <= 56) nextSize = parsedSize + 2;
            else nextSize = displaySize;
            const customNamePersist = isCustom ? sanitizeTextInput(document.getElementById('billCustomName')?.value?.trim() || '') : '';
            appState.lastBillInput = { category, size: nextSize, quantity, customName: customNamePersist };
            render();
        }

                    letterRendering: true,
                    logging: false,
                    onclone: (clonedDoc) => {
                        const bill = clonedDoc.getElementById('printable-bill');
                        if (bill) {
                            bill.style.setProperty('width', '1100px', 'important');
                            bill.style.setProperty('min-width', '1100px', 'important');
                            bill.style.setProperty('max-width', 'none', 'important');
                            bill.style.setProperty('margin', '0 auto', 'important');
                            bill.style.setProperty('padding', '40px', 'important');
                            bill.style.setProperty('display', 'block', 'important');
                        }
                        const cloneApp = clonedDoc.getElementById('app');
                        if (cloneApp) cloneApp.classList.add('pdf-capture-mode');
                    }
                },
                jsPDF: { unit: 'mm', format: 'a3', orientation: 'portrait', compress: true }
            };
        }

        function isCanvasSecurityError(error) {
            return error?.name === 'SecurityError' || String(error?.message || '').includes('Tainted canvases');
        }

        function blobToDataUrl(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }

        const TRANSPARENT_PIXEL_DATA_URI = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==';

        async function sanitizeImagesForPdf(root) {
            const images = Array.from(root.querySelectorAll('img'));
            const isFileProtocol = window.location.protocol === 'file:';
            await Promise.all(images.map(async (img) => {
                const src = img.getAttribute('src');
                if (!src || src.startsWith('data:')) return;
                try {
                    if (isFileProtocol) { img.setAttribute('src', TRANSPARENT_PIXEL_DATA_URI); img.removeAttribute('srcset'); return; }
                    const absoluteSrc = new URL(src, window.location.href).href;
                    const response = await fetch(absoluteSrc, { mode: 'cors', cache: 'force-cache' });
                    if (!response.ok) throw new Error(`Failed to fetch image: ${response.status}`);
                    const blob = await response.blob();
                    const dataUrl = await blobToDataUrl(blob);
                    img.setAttribute('src', dataUrl);
                    img.removeAttribute('srcset');
                    img.setAttribute('crossorigin', 'anonymous');
                } catch (error) {
                    img.setAttribute('src', TRANSPARENT_PIXEL_DATA_URI);
                    img.removeAttribute('srcset');
                }
            }));
        }

        async function withPdfSafeElement(sourceElement, callback) {
            const images = Array.from(sourceElement.querySelectorAll('img'));
            const originalState = images.map((img) => ({
                img,
                src: img.getAttribute('src'),
                srcset: img.getAttribute('srcset'),
                crossorigin: img.getAttribute('crossorigin')
            }));
            try {
                await sanitizeImagesForPdf(sourceElement);
                return await callback(sourceElement);
            } finally {
                originalState.forEach(({ img, src, srcset, crossorigin }) => {
                    if (src === null) img.removeAttribute('src'); else img.setAttribute('src', src);
                    if (srcset === null) img.removeAttribute('srcset'); else img.setAttribute('srcset', srcset);
                    if (crossorigin === null) img.removeAttribute('crossorigin'); else img.setAttribute('crossorigin', crossorigin);
                });
            }
        }

        async function runHtml2PdfWithFallback(element, opt, mode) {
            // IMPROVED #1: Ensure html2pdf is loaded before use
            await ensureHtml2Pdf();
            try {
                const worker = html2pdf().set(opt).from(element);
                if (mode === 'blob') return await worker.output('blob');
                await worker.save();
                return null;
            } catch (error) {
                if (!isCanvasSecurityError(error)) throw error;
                return await withPdfSafeElement(element, async (safeElement) => {
                    const worker = html2pdf().set(opt).from(safeElement);
                    if (mode === 'blob') return await worker.output('blob');
                    await worker.save();
                    return null;
                });
            }
        }

        async function runBillPdfAction(loadingKey, action) {
            if (!appState.currentBill) { showToast('لا توجد فاتورة نشطة', 'error'); return; }
            const { container, element } = getBillPdfElements();
            if (!container || !element) { showToast('تعذر العثور على محتوى الفاتورة للتصدير', 'error'); return; }
            const filename = `invoice_${appState.currentBill.billNumber}.pdf`;
            const opt = buildBillPdfOptions(filename);
            setLoading(loadingKey, true);
            try {
                await action({ element, filename, opt });
            } finally {
                setLoading(loadingKey, false);
            }
        }

        async function preGenerateBillPdf() {
            if (!appState.currentBill) return;
            if (appState.currentBillPdfBlob && appState.currentBillPdfBlob.size > 0) return;
            if (appState.loadingStates.sharing) return;
            const { container, element } = getBillPdfElements();
            if (!container || !element) return;
            const filename = `invoice_${appState.currentBill.billNumber}.pdf`;
            const opt = buildBillPdfOptions(filename);
            try {
                const blob = await runHtml2PdfWithFallback(element, opt, 'blob');
                if (blob && blob.size > 0) { appState.currentBillPdfBlob = blob; console.log('[preGenerateBillPdf] cached:', blob.size, 'bytes'); }
                else console.warn('[preGenerateBillPdf] empty blob generated');
            } catch (e) { console.warn('[preGenerateBillPdf] failed:', e); }
        }

        async function shareBill() {
            console.log('[shareBill] started');
            if (!appState.currentBill) { showToast('لا توجد فاتورة نشطة', 'error'); return; }
            const filename = `invoice_${appState.currentBill.billNumber}.pdf`;
            const opt = buildBillPdfOptions(filename);
            setLoading('sharing', true);
            await new Promise(r => requestAnimationFrame(r));
            const { container, element } = getBillPdfElements();
            if (!container || !element) { setLoading('sharing', false); showToast('تعذر العثور على محتوى الفاتورة للتصدير', 'error'); return; }
            try {
                let pdfBlob = appState.currentBillPdfBlob;
                if (!pdfBlob || pdfBlob.size === 0) {
                    appState.currentBillPdfBlob = null;
                    pdfBlob = await runHtml2PdfWithFallback(element, opt, 'blob');
                    if (pdfBlob && pdfBlob.size > 0) appState.currentBillPdfBlob = pdfBlob;
                }
                if (!pdfBlob || pdfBlob.size === 0) { showToast('فشل إنشاء ملف PDF', 'error'); return; }
                const file = new File([pdfBlob], filename, { type: 'application/pdf' });
                const canShareFiles = navigator.share && typeof navigator.canShare === 'function' && navigator.canShare({ files: [file] });
                if (canShareFiles) {
                    try {
                        await navigator.share({ files: [file], title: 'فاتورة الذهب الأبيض' });
                        showToast('تم فتح نافذة المشاركة', 'success');
                    } catch (shareErr) {
                        if (shareErr.name === 'AbortError') return;
                        throw shareErr;
                    }
                } else if (navigator.share) {
                    try {
                        await navigator.share({ title: 'فاتورة الذهب الأبيض', text: `فاتورة رقم ${appState.currentBill.billNumber} - الإجمالي: ${appState.currentBill.billTotal.toFixed(2)} جنيه` });
                        showToast('تمت مشاركة النص (مشاركة الملفات غير مدعومة)', 'info');
                    } catch (textShareErr) { if (textShareErr.name === 'AbortError') return; throw textShareErr; }
                } else {
                    const url = URL.createObjectURL(pdfBlob);
                    const a = document.createElement('a');
                    a.href = url; a.download = filename;
                    document.body.appendChild(a); a.click(); document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    showToast('تم التنزيل (مشاركة الملفات غير مدعومة على هذا الجهاز)', 'success');
                }
            } catch (error) {
                console.error('[shareBill] outer catch:', error.name, error.message);
                if (error.name === 'AbortError') return;
                const msg = String(error.message || '');
                if (error.name === 'NotAllowedError' || msg.includes('user gesture') || msg.includes('Must be handling') || msg.includes('NotAllowedError')) {
                    showToast('جاري التنزيل بدلاً من المشاركة (انتهت صلاحية الإجراء)', 'info');
                    try {
                        let fbBlob = appState.currentBillPdfBlob;
                        if (!fbBlob || fbBlob.size === 0) fbBlob = await runHtml2PdfWithFallback(element, opt, 'blob');
                        if (fbBlob && fbBlob.size > 0) {
                            const url = URL.createObjectURL(fbBlob);
                            const a = document.createElement('a'); a.href = url; a.download = filename;
                            document.body.appendChild(a); a.click(); document.body.removeChild(a);
                            URL.revokeObjectURL(url);
                        }
                    } catch (e2) { console.error('Fallback download error:', e2); }
                    return;
                }
                showToast('حدث خطأ أثناء المشاركة: ' + msg, 'error');
            } finally {
                setLoading('sharing', false);
            }
        }

                setLoading(`delete-bill-${bill.__backendId}`, true);

                    confirmDelete.style.display = 'inline-flex';
                    setTimeout(() => confirmDelete.style.display = 'none', 3000);
                }
            }
        }

        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

            appState.loadingStates[key] = isLoading;

            toast.textContent = message;

                                        <tbody>${bill.items.map((item) => `<tr><td class="text-center font-bold" style="color: ${config.accent_color};">${item.total.toFixed(2)}</td><td class="text-center font-semibold">${item.quantity.toFixed(2)}</td><td class="text-center">${item.unitPrice.toFixed(2)}</td><td class="text-center"><span class="inline-block px-2 py-0.5 rounded-md text-xs font-semibold text-white" style="background-color: ${config.primary_color};">${escapeHtml(item.category)}</span></td><td class="text-center font-semibold">${item.size}</td></tr>`).join('')}</tbody>
                                    </table>
                                </div>
                                <div class="bill-total-box"><div class="flex justify-between items-center"><div><h3 class="bill-total-label">الإجمالي الكلي</h3></div><div class="text-left"><p class="bill-total-value">${bill.billTotal.toFixed(2)}</p><p class="bill-total-currency">جنيه مصري</p></div></div></div>
                                <div class="bill-footer-line mt-2 pt-2 text-center"><p class="text-sm font-semibold" style="color: #64748b;">${escapeHtml(appState.companySettings.footer)}</p><p class="text-xs mt-2" style="color: #cbd5e0;">تم إنشاء هذه الفاتورة إلكترونيا - ${formattedDate}</p></div>
                            </div>
                        </div>
                    </div>
                </div>`;
        }

        function renderSettings() {
            const config = window.elementSdk?.config || defaultConfig;
            return `
                <div class="fade-in">
                    <h1 class="text-4xl font-bold mb-8" style="color: ${config.text_color};">الإعدادات</h1>
                    <div class="card-shadow rounded-xl p-6 bg-white max-w-2xl"><h2 class="text-2xl font-bold mb-6">معلومات الشركة</h2>
                        <form onsubmit="saveSettings(event);" class="space-y-6">
                            <div><label class="block text-sm font-semibold mb-2">اسم الشركة</label><input type="text" id="settingsName" value="${escapeHtml(appState.companySettings.name)}" required class="w-full px-4 py-3 border-2 rounded-lg" style="border-color: ${config.primary_color};"></div>
                            <div><label class="block text-sm font-semibold mb-2">رقم الهاتف</label><input type="text" id="settingsPhone" value="${escapeHtml(appState.companySettings.phone)}" required class="w-full px-4 py-3 border-2 rounded-lg" style="border-color: ${config.primary_color};"></div>
                            <div><label class="block text-sm font-semibold mb-2">العنوان</label><input type="text" id="settingsAddress" value="${escapeHtml(appState.companySettings.address)}" required class="w-full px-4 py-3 border-2 rounded-lg" style="border-color: ${config.primary_color};"></div>
                            <div><label class="block text-sm font-semibold mb-2">نص التذييل</label><input type="text" id="settingsFooter" value="${escapeHtml(appState.companySettings.footer)}" required class="w-full px-4 py-3 border-2 rounded-lg" style="border-color: ${config.primary_color};"></div>
                            <div>
                                <label class="block text-sm font-semibold mb-2">شعار الشركة</label>
                                <div class="flex items-center gap-4">
                                    <div class="h-20 w-20 bg-gray-100 rounded-lg flex items-center justify-center overflow-hidden border-2" style="border-color: ${config.primary_color};">
                                        <img id="settingsLogoPreview" src="${getLogoSource()}" alt="Logo" class="h-full w-full object-contain" onerror="this.onerror=null;this.src='${FALLBACK_LOGO_DATA_URI}'">
                                    </div>
                                    <div class="flex flex-col gap-2">
                                        <input type="file" id="settingsLogo" accept="image/svg+xml,image/png,image/jpeg,image/jpg" onchange="handleLogoUpload(event)" class="hidden">
                                        <button type="button" onclick="document.getElementById('settingsLogo').click()" class="px-4 py-2 rounded-lg font-semibold text-white text-sm" style="background-color: ${config.primary_color};">تغيير الشعار</button>
                                        ${appState.companySettings.logo ? `<button type="button" onclick="removeLogo()" class="px-4 py-2 bg-red-500 rounded-lg font-semibold text-white text-sm">إزالة الشعار</button>` : ''}
                                    </div>
                                </div>
                                <p class="text-xs opacity-75 mt-1">الصيغ المدعومة: SVG, PNG, JPG</p>
                            </div>
                            <button type="submit" ${isLoading('saveSettings') ? 'disabled' : ''} class="w-full py-3 rounded-lg font-bold text-white text-lg flex items-center justify-center gap-2" style="background-color: ${config.primary_color};">${isLoading('saveSettings') ? '<div class="loading-spinner"></div>' : ''}<span>حفظ الإعدادات</span></button>
                        </form>
                    </div>
                    <div class="card-shadow rounded-xl p-6 bg-white max-w-2xl mt-6">
                        <h2 class="text-2xl font-bold mb-4">💾 إدارة التخزين</h2>
                        <p class="text-slate-500 text-sm mb-4">عرض وتعديل جميع البيانات المخزنة في ملف JSON.</p>
                        <button onclick="appState.currentView = 'storage'; _storageRawData = null; _storageExpandedItem = null; render();" class="w-full py-3 rounded-lg font-bold text-white text-lg flex items-center justify-center gap-2" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                            <span>فتح بيانات التخزين</span><span>←</span>
                        </button>
                    </div>
                </div>`;
        }

        // Storage Data Management (unchanged from original)
        let _storageRawData = null;
        let _storageExpandedItem = null;
        let _storageLoading = false;

        function getTypeLabel(type) {
            const labels = { 'pricingModel': '💰 نموذج تسعير', 'bill': '📄 فاتورة', 'settings': '⚙️ إعدادات', 'user': '👤 مستخدم' };
            return labels[type] || '📝 ' + (type || 'غير معروف');
        }

        function getTypeBadgeColor(type) {
            const colors = { 'pricingModel': 'bg-indigo-100 text-indigo-800', 'bill': 'bg-emerald-100 text-emerald-800', 'settings': 'bg-amber-100 text-amber-800', 'user': 'bg-sky-100 text-sky-800' };
            return colors[type] || 'bg-gray-100 text-gray-800';
        }

        function getEntryTitle(entry) {
            if (entry.type === 'pricingModel') return entry.pricingModelName || 'بدون اسم';
            if (entry.type === 'bill') return (entry.bn || entry.billNumber || 'بدون رقم') + ' — ' + (entry.bc || entry.billClientName || 'بدون اسم');
            if (entry.type === 'settings') return 'إعدادات الشركة';
            if (entry.type === 'user') return entry.name || entry.email || 'مستخدم';
            return 'عنصر';
        }

        async function loadStorageRawData() {
            if (!window.dataSdk || !window.dataSdk.getRawData) return [];
            try {
                const data = await window.dataSdk.getRawData();
                _storageRawData = data;
                return data;
            } catch (e) {
                console.error('Failed to load raw data:', e);
                showToast('فشل تحميل بيانات التخزين', 'error');
                return [];
            }
        }

        async function storageToggleExpand(backendId) { _storageExpandedItem = _storageExpandedItem === backendId ? null : backendId; render(); }

        async function storageDeleteEntry(backendId) {
            if (!confirm('هل أنت متأكد من حذف هذا العنصر نهائياً؟ لا يمكن التراجع عن هذا الإجراء.')) return;
            setLoading('storageDelete', true);
            try {
                const data = await loadStorageRawData();
                const idx = data.findIndex(d => d.__backendId === backendId);
                if (idx < 0) {
                    for (const group of data) {
                        if (group.type === 'pricingModel' && Array.isArray(group.data)) {
                            const vIdx = group.data.findIndex(v => v.__backendId === backendId);
                            if (vIdx >= 0) {
                                group.data.splice(vIdx, 1);
                                if (group.data.length === 0) { const gIdx = data.indexOf(group); data.splice(gIdx, 1); }
                                break;
                            }
                        }
                    }
                } else {
                    data.splice(idx, 1);
                }
                await window.dataSdk.writeRawData(data);
                _storageRawData = data;
                _storageExpandedItem = null;
                showToast('تم الحذف بنجاح', 'success');
                render();
            } catch (e) {
                console.error('Delete failed:', e);
                showToast('فشل حذف العنصر', 'error');
            } finally {
                setLoading('storageDelete', false);
            }
        }

        async function storageDeletePricingGroup(groupName) {
            if (!confirm('هل أنت متأكد من حذف جميع إصدارات نموذج "' + groupName + '" نهائياً؟ لا يمكن التراجع.')) return;
            setLoading('storageDelete', true);
            try {
                const data = await loadStorageRawData();
                const filtered = data.filter(d => !(d.type === 'pricingModel' && d.pricingModelName === groupName));
                await window.dataSdk.writeRawData(filtered);
                _storageRawData = filtered;
                _storageExpandedItem = null;
                showToast('تم حذف النموذج بالكامل بنجاح', 'success');
                render();
            } catch (e) {
                console.error('Delete group failed:', e);
                showToast('فشل حذف النموذج', 'error');
            } finally {
                setLoading('storageDelete', false);
            }
        }

        async function storageRestoreVersion(groupName, backendId) {
            setLoading('storageRestore', true);
            try {
                const data = await loadStorageRawData();
                const group = data.find(d => d.type === 'pricingModel' && d.pricingModelName === groupName);
                if (group) {
                    const version = group.data.find(v => v.__backendId === backendId);
                    if (version) {
                        delete version.isDeleted;
                        await window.dataSdk.writeRawData(data);
                        _storageRawData = data;
                        showToast('تم استعادة الإصدار بنجاح', 'success');
                        render();
                        return;
                    }
                }
                showToast('لم يتم العثور على الإصدار', 'error');
            } catch (e) {
                console.error('Restore failed:', e);
                showToast('فشل استعادة الإصدار', 'error');
            } finally {
                setLoading('storageRestore', false);
            }
        }

        async function storageSaveEdit(backendId) {
            const editor = document.getElementById('storage-json-editor-' + backendId);
            if (!editor) return;
            let newData;
            try { newData = JSON.parse(editor.value); }
            catch (e) { showToast('JSON غير صالح — تأكد من الصيغة', 'error'); return; }
            setLoading('storageSave', true);
            try {
                const data = await loadStorageRawData();
                let found = false;
                const tIdx = data.findIndex(d => d.__backendId === backendId);
                if (tIdx >= 0) { data[tIdx] = newData; found = true; }
                if (!found) {
                    for (const group of data) {
                        if (group.type === 'pricingModel' && Array.isArray(group.data)) {
                            const vIdx = group.data.findIndex(v => v.__backendId === backendId);
                            if (vIdx >= 0) { group.data[vIdx] = newData; found = true; break; }
                        }
                    }
                }
                if (!found) { showToast('لم يتم العثور على العنصر', 'error'); return; }
                await window.dataSdk.writeRawData(data);
                _storageRawData = data;
                showToast('تم حفظ التعديلات بنجاح', 'success');
                render();
            } catch (e) {
                console.error('Save edit failed:', e);
                showToast('فشل حفظ التعديلات', 'error');
            } finally {
                setLoading('storageSave', false);
            }
        }

        async function storageToggleEdit(backendId) {
            const viewer = document.getElementById('storage-viewer-' + backendId);
            const editorWrap = document.getElementById('storage-editor-' + backendId);
            const btnEdit = document.getElementById('storage-btn-edit-' + backendId);
            if (viewer && editorWrap && btnEdit) {
                const isEditing = editorWrap.style.display !== 'none';
                viewer.style.display = isEditing ? 'block' : 'none';
                editorWrap.style.display = isEditing ? 'none' : 'block';
                btnEdit.textContent = isEditing ? '✏️ تعديل' : '👁️ عرض';
                if (!isEditing) {
                    let entry = null;
                    if (_storageRawData) entry = _storageRawData.find(d => d.__backendId === backendId);
                    if (!entry) {
                        for (const group of (_storageRawData || [])) {
                            if (group.type === 'pricingModel' && Array.isArray(group.data)) {
                                const v = group.data.find(v => v.__backendId === backendId);
                                if (v) { entry = v; break; }
                            }
                        }
                    }
                    if (entry) document.getElementById('storage-json-editor-' + backendId).value = JSON.stringify(entry, null, 2);
                }
            }
        }

        async function storageExportJSON() {
            try {
                const data = await loadStorageRawData();
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = 'white_gold_app_data_backup.json';
                a.click(); URL.revokeObjectURL(url);
                showToast('تم تصدير البيانات بنجاح', 'success');
            } catch (e) { console.error('Export failed:', e); showToast('فشل تصدير البيانات', 'error'); }
        }

        async function storageImportJSON() {
            const input = document.createElement('input');
            input.type = 'file'; input.accept = '.json';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (!confirm('سيتم استبدال جميع البيانات الحالية بالملف المحدد. هل أنت متأكد؟')) return;
                try {
                    const text = await file.text();
                    const data = JSON.parse(text);
                    if (!Array.isArray(data)) { showToast('ملف JSON غير صالح — يجب أن يكون مصفوفة', 'error'); return; }
                    setLoading('storageImport', true);
                    await window.dataSdk.writeRawData(data);
                    _storageRawData = data; _storageExpandedItem = null;
                    showToast('تم استيراد البيانات بنجاح', 'success');
                    render();
                } catch (e) {
                    console.error('Import failed:', e);
                    showToast('فشل استيراد البيانات — تأكد من صحة الملف', 'error');
                } finally { setLoading('storageImport', false); }
            };
            input.click();
        }

        function renderStorage() {
            const config = window.elementSdk?.config || defaultConfig;
            const raw = _storageRawData;
            if (!raw) {
                if (_storageLoading) {
                    return `<div class="fade-in"><h1 class="text-4xl font-bold mb-8" style="color: ${config.text_color};">💾 بيانات التخزين</h1><div class="flex items-center gap-3 p-6 card-shadow rounded-xl bg-white"><div class="loading-spinner" style="border-top-color: ${config.primary_color};"></div><span class="font-semibold text-slate-600">جاري تحميل البيانات...</span></div></div>`;
                }
                _storageLoading = true;
                loadStorageRawData().then(() => { _storageLoading = false; render(); });
                return `<div class="fade-in"><h1 class="text-4xl font-bold mb-8" style="color: ${config.text_color};">💾 بيانات التخزين</h1><div class="flex items-center gap-3 p-6 card-shadow rounded-xl bg-white"><div class="loading-spinner" style="border-top-color: ${config.primary_color};"></div><span class="font-semibold text-slate-600">جاري تحميل البيانات...</span></div></div>`;
            }

            const settingsEntries = raw.filter(d => d.type === 'settings');
            const pricingGroups = raw.filter(d => d.type === 'pricingModel');
            const billEntries = raw.filter(d => d.type === 'bill');
            const userEntries = raw.filter(d => d.type === 'user');
            const otherEntries = raw.filter(d => !['settings', 'pricingModel', 'bill', 'user'].includes(d.type));
            const totalVersions = pricingGroups.reduce((sum, g) => sum + (Array.isArray(g.data) ? g.data.length : 0), 0);
            const deletedVersions = pricingGroups.reduce((sum, g) => sum + (Array.isArray(g.data) ? g.data.filter(v => v.isDeleted).length : 0), 0);
            const jsonStr = JSON.stringify(raw);
            const jsonSizeBytes = new Blob([jsonStr]).size;
            const jsonSizeFormatted = jsonSizeBytes < 1024 ? jsonSizeBytes + ' B' : jsonSizeBytes < 1024 * 1024 ? (jsonSizeBytes / 1024).toFixed(1) + ' KB' : (jsonSizeBytes / (1024 * 1024)).toFixed(2) + ' MB';

            function buildEntryCard(entry, showActions = true) {
                const isExpanded = _storageExpandedItem === entry.__backendId;
                const jStr = JSON.stringify(entry, null, 2);
                const truncated = jStr.length > 500 ? jStr.substring(0, 500) + '\n...' : jStr;
                const escapedJson = escapeHtml(truncated).replace(/\n/g, '&#10;');
                return `
                    <div class="border border-gray-200 rounded-xl overflow-hidden transition-all ${isExpanded ? 'ring-2 ring-indigo-300' : ''}">
                        <div class="flex items-center justify-between px-4 py-3 bg-gray-50 cursor-pointer hover:bg-gray-100 transition-colors" onclick="storageToggleExpand('${entry.__backendId}')">
                            <div class="flex items-center gap-3 flex-1 min-w-0">
                                <span class="px-2 py-1 rounded-lg text-xs font-bold ${getTypeBadgeColor(entry.type)}">${getTypeLabel(entry.type)}</span>
                                <span class="font-semibold text-slate-700 truncate text-sm">${escapeHtml(getEntryTitle(entry))}</span>
                                ${entry.isDeleted ? '<span class="px-2 py-0.5 rounded-full text-xs bg-red-100 text-red-700 font-bold">محذوف</span>' : ''}
                                ${entry.updatedAt ? '<span class="text-xs text-slate-400">' + new Date(entry.updatedAt).toLocaleDateString('ar-EG') + '</span>' : ''}
                            </div>
                            <span class="text-slate-400 mr-2 transition-transform ${isExpanded ? 'rotate-180' : ''}">▼</span>
                        </div>
                        ${isExpanded ? `
                            <div class="p-4 bg-white border-t border-gray-100">
                                <div id="storage-viewer-${entry.__backendId}"><pre class="text-xs text-slate-600 bg-slate-50 rounded-lg p-4 overflow-auto max-h-96 whitespace-pre-wrap font-mono" dir="ltr">${escapedJson}</pre></div>
                                <div id="storage-editor-${entry.__backendId}" style="display:none;" class="mb-3"><textarea id="storage-json-editor-${entry.__backendId}" class="w-full h-64 text-xs font-mono bg-slate-50 border-2 border-gray-200 rounded-lg p-3 focus:border-indigo-400 focus:outline-none" dir="ltr"></textarea></div>
                                ${showActions ? `
                                    <div class="flex flex-wrap gap-2 mt-3 pt-3 border-t border-gray-100">
                                        <button id="storage-btn-edit-${entry.__backendId}" onclick="event.stopPropagation(); storageToggleEdit('${entry.__backendId}');" class="px-3 py-1.5 bg-indigo-100 text-indigo-700 rounded-lg text-xs font-bold hover:bg-indigo-200 transition-colors">✏️ تعديل</button>
                                        <button onclick="event.stopPropagation(); storageSaveEdit('${entry.__backendId}');" class="px-3 py-1.5 bg-emerald-100 text-emerald-700 rounded-lg text-xs font-bold hover:bg-emerald-200 transition-colors">💾 حفظ</button>
                                        <button onclick="event.stopPropagation(); storageDeleteEntry('${entry.__backendId}');" class="px-3 py-1.5 bg-red-100 text-red-700 rounded-lg text-xs font-bold hover:bg-red-200 transition-colors">🗑️ حذف</button>
                                        ${entry.isDeleted ? `<button onclick="event.stopPropagation(); storageRestoreVersion('${entry.pricingModelName || ''}', '${entry.__backendId}');" class="px-3 py-1.5 bg-amber-100 text-amber-700 rounded-lg text-xs font-bold hover:bg-amber-200 transition-colors">↩️ استعادة</button>` : ''}
                                    </div>` : ''}
                            </div>` : ''}
                    </div>`;
            }

            return `
                <div class="fade-in">
                    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-8">
                        <div><h1 class="text-4xl font-bold" style="color: ${config.text_color};">💾 بيانات التخزين</h1><p class="text-sm text-slate-500 mt-1">عرض وتعديل جميع البيانات المخزنة في ملف JSON</p></div>
                        <div class="flex flex-wrap gap-2">
                            <button onclick="storageExportJSON();" class="px-4 py-2 bg-emerald-100 text-emerald-700 rounded-lg text-sm font-bold hover:bg-emerald-200 transition-colors">📤 تصدير JSON</button>
                            <button onclick="storageImportJSON();" class="px-4 py-2 bg-amber-100 text-amber-700 rounded-lg text-sm font-bold hover:bg-amber-200 transition-colors">📥 استيراد JSON</button>
                            <button onclick="loadStorageRawData().then(() => render());" class="px-4 py-2 bg-indigo-100 text-indigo-700 rounded-lg text-sm font-bold hover:bg-indigo-200 transition-colors">🔄 تحديث</button>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-8">
                        <div class="card-shadow rounded-xl p-4 bg-white text-center"><div class="text-3xl font-black text-indigo-600">${pricingGroups.length}</div><div class="text-sm text-slate-500 font-semibold mt-1">نماذج التسعير</div><div class="text-xs text-slate-400">${totalVersions} إصدار</div></div>
                        <div class="card-shadow rounded-xl p-4 bg-white text-center"><div class="text-3xl font-black text-emerald-600">${billEntries.length}</div><div class="text-sm text-slate-500 font-semibold mt-1">الفواتير</div></div>
                        <div class="card-shadow rounded-xl p-4 bg-white text-center"><div class="text-3xl font-black text-red-600">${deletedVersions}</div><div class="text-sm text-slate-500 font-semibold mt-1">إصدارات محذوفة</div></div>
                        <div class="card-shadow rounded-xl p-4 bg-white text-center"><div class="text-3xl font-black text-slate-600">${raw.length}</div><div class="text-sm text-slate-500 font-semibold mt-1">إجمالي العناصر</div></div>
                        <div class="card-shadow rounded-xl p-4 bg-white text-center col-span-2 md:col-span-1"><div class="text-2xl font-black ${jsonSizeBytes > 1024 * 1024 ? 'text-red-600' : jsonSizeBytes > 100 * 1024 ? 'text-amber-600' : 'text-green-600'}">${jsonSizeFormatted}</div><div class="text-sm text-slate-500 font-semibold mt-1">حجم JSON</div></div>
                    </div>
                    ${settingsEntries.length > 0 ? `<div class="mb-6"><h2 class="text-xl font-bold mb-3 text-slate-700 flex items-center gap-2">⚙️ الإعدادات</h2><div class="space-y-2">${settingsEntries.map(e => buildEntryCard(e)).join('')}</div></div>` : ''}
                    ${pricingGroups.length > 0 ? `<div class="mb-6"><h2 class="text-xl font-bold mb-3 text-slate-700 flex items-center gap-2">💰 نماذج التسعير</h2><div class="space-y-5">${pricingGroups.map(group => {
                        const versions = Array.isArray(group.data) ? group.data : [];
                        const activeCount = versions.filter(v => !v.isDeleted).length;
                        const deletedCount = versions.filter(v => v.isDeleted).length;
                        return `<div class="card-shadow rounded-2xl bg-white overflow-hidden">
                            <div class="flex items-center justify-between px-5 py-4 bg-gradient-to-l from-indigo-50 to-white border-b border-indigo-100">
                                <div class="flex items-center gap-3 flex-1 min-w-0">
                                    <span class="text-xl font-black text-indigo-800">${escapeHtml(group.pricingModelName || 'بدون اسم')}</span>
                                    <span class="px-2.5 py-0.5 rounded-full text-xs bg-indigo-100 text-indigo-700 font-bold">${activeCount} نشط</span>

                                <button onclick="event.stopPropagation(); storageDeletePricingGroup('${escapeHtml(group.pricingModelName || '')}');" class="px-3 py-1.5 bg-red-100 text-red-600 rounded-lg text-xs font-bold hover:bg-red-200 transition-colors">🗑️ حذف الكل</button>

                                    const catCount = Array.isArray(v.data) ? v.data.length : 0;
                                    const pricedCount = Array.isArray(v.data) ? v.data.reduce((s, c) => s + (Array.isArray(c.prices) ? c.prices.filter(p => p.price > 0).length : 0), 0) : 0;
                                    const vDate = v.updatedAt || v.createdAt || '';
                                    const dateStr = vDate ? new Date(vDate).toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
                                    const jStr2 = JSON.stringify(v, null, 2);
                                    const truncated2 = jStr2.length > 500 ? jStr2.substring(0, 500) + '\n...' : jStr2;
                                    const escapedJson2 = escapeHtml(truncated2).replace(/\n/g, '&#10;');
                                    return `<div class="transition-all ${isActive ? '' : 'opacity-60'} ${isExpanded ? 'bg-indigo-50/50' : 'hover:bg-gray-50'}">
                                        <div class="flex items-center justify-between px-5 py-3 cursor-pointer" onclick="storageToggleExpand('${v.__backendId}')">
                                            <div class="flex items-center gap-3 flex-1 min-w-0">

                                                <div class="flex-1 min-w-0">
                                                    <div class="flex items-center gap-2">

                                                        ${isActive ? '<span class="px-2 py-0.5 rounded-full text-xs bg-green-100 text-green-700 font-bold">نشط</span>' : '<span class="px-2 py-0.5 rounded-full text-xs bg-red-100 text-red-700 font-bold">محذوف</span>'}
                                                    </div>
                                                    <div class="flex items-center gap-3 mt-0.5">
                                                        <span class="text-xs text-slate-400">${catCount} فئة</span>
                                                        <span class="text-xs text-slate-400">${pricedCount} سعر مسعر</span>
                                                        ${dateStr ? `<span class="text-xs text-slate-400">${dateStr}</span>` : ''}
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="flex items-center gap-2" onclick="event.stopPropagation()">
                                                <button onclick="event.stopPropagation(); storageToggleEdit('${v.__backendId}');" id="storage-btn-edit-${v.__backendId}" class="px-2.5 py-1 bg-indigo-100 text-indigo-700 rounded-lg text-xs font-bold hover:bg-indigo-200 transition-colors">✏️ تعديل</button>
                                                <button onclick="event.stopPropagation(); storageSaveEdit('${v.__backendId}');" class="px-2.5 py-1 bg-emerald-100 text-emerald-700 rounded-lg text-xs font-bold hover:bg-emerald-200 transition-colors">💾 حفظ</button>
                                                <button onclick="event.stopPropagation(); storageDeleteEntry('${v.__backendId}');" class="px-2.5 py-1 bg-red-100 text-red-700 rounded-lg text-xs font-bold hover:bg-red-200 transition-colors">🗑️ حذف</button>
                                                ${v.isDeleted ? `<button onclick="event.stopPropagation(); storageRestoreVersion('${escapeHtml(group.pricingModelName || '')}', '${v.__backendId}');" class="px-2.5 py-1 bg-amber-100 text-amber-700 rounded-lg text-xs font-bold hover:bg-amber-200 transition-colors">↩️ استعادة</button>` : ''}
                                                <span class="text-slate-400 mr-1 transition-transform text-xs ${isExpanded ? 'rotate-180' : ''}">▼</span>
                                            </div>
                                        </div>
                                        ${isExpanded ? `<div class="px-5 pb-4 bg-white border-t border-gray-100">
                                            <div id="storage-viewer-${v.__backendId}"><pre class="text-xs text-slate-600 bg-slate-50 rounded-lg p-4 overflow-auto max-h-96 whitespace-pre-wrap font-mono" dir="ltr">${escapedJson2}</pre></div>
                                            <div id="storage-editor-${v.__backendId}" style="display:none;" class="mb-3"><textarea id="storage-json-editor-${v.__backendId}" class="w-full h-64 text-xs font-mono bg-slate-50 border-2 border-gray-200 rounded-lg p-3 focus:border-indigo-400 focus:outline-none" dir="ltr"></textarea></div>
                                        </div>` : ''}
                                    </div>`;
                                }).join('')}
                            </div>
                        </div>`;
                    }).join('')}</div></div>` : ''}
                    ${billEntries.length > 0 ? `<div class="mb-6"><h2 class="text-xl font-bold mb-3 text-slate-700 flex items-center gap-2">📄 الفواتير</h2><div class="space-y-2">${billEntries.map(e => buildEntryCard(e)).join('')}</div></div>` : ''}
                    ${userEntries.length > 0 ? `<div class="mb-6"><h2 class="text-xl font-bold mb-3 text-slate-700 flex items-center gap-2">👤 المستخدمين</h2><div class="space-y-2">${userEntries.map(e => buildEntryCard(e)).join('')}</div></div>` : ''}
                    ${otherEntries.length > 0 ? `<div class="mb-6"><h2 class="text-xl font-bold mb-3 text-slate-700 flex items-center gap-2">📝 عناصر أخرى</h2><div class="space-y-2">${otherEntries.map(e => buildEntryCard(e)).join('')}</div></div>` : ''}
                    ${raw.length === 0 ? `<div class="text-center py-16"><div class="text-6xl mb-4">📭</div><h3 class="text-xl font-bold text-slate-600 mb-2">لا توجد بيانات مخزنة</h3><p class="text-slate-400">ابدأ بإضافة نماذج تسعير أو فواتير لتظهر هنا</p></div>` : ''}
                </div>`;
        }

        function getCategoryIcon(category) {
            const icons = { 'سليب': 'سليب', 'نصف كم': 'نصفكم', 'شورت': 'شورت', 'حماله': 'حماله', 'كلسون': 'كلسون', 'كم': 'كم' };
            const iconFile = icons[category] || 'default';
            const imgSrc = 'assets/png/' + iconFile + '.PNG';
            const uid = 'cat-icon-' + category.replace(/\s+/g, '-');
            return `<img id="${uid}" src="${imgSrc}" alt="${category}" class="category-icon-img" loading="lazy" onerror="setupImageFallback(this,'${category.replace(/'/g, "\\'")}')">`;
        }

        function scrollToAbout() { document.getElementById('about').scrollIntoView({ behavior: 'smooth' }); }
        function scrollToContact() { document.getElementById('contact').scrollIntoView({ behavior: 'smooth' }); }
        function attachEventListeners() { /* handlers attached via onclick attributes in HTML */ }

        async function onConfigChange(config) { render(); }

        const element = {
            defaultConfig,
            onConfigChange,
            mapToCapabilities: (config) => ({
                recolorables: [
                    { get: () => config.primary_color || defaultConfig.primary_color, set: (v) => { config.primary_color = v; window.elementSdk.setConfig({ primary_color: v }); } },
                    { get: () => config.secondary_color || defaultConfig.secondary_color, set: (v) => { config.secondary_color = v; window.elementSdk.setConfig({ secondary_color: v }); } },
                    { get: () => config.accent_color || defaultConfig.accent_color, set: (v) => { config.accent_color = v; window.elementSdk.setConfig({ accent_color: v }); } },
                    { get: () => config.background_color || defaultConfig.background_color, set: (v) => { config.background_color = v; window.elementSdk.setConfig({ background_color: v }); } },
                    { get: () => config.text_color || defaultConfig.text_color, set: (v) => { config.text_color = v; window.elementSdk.setConfig({ text_color: v }); } }
                ],

                fontSizeable: { get: () => config.font_size || defaultConfig.font_size, set: (v) => { config.font_size = v; window.elementSdk.setConfig({ font_size: v }); } }
            }),

                ["company_name", config.company_name || defaultConfig.company_name],

                ["hero_title", config.hero_title || defaultConfig.hero_title],
